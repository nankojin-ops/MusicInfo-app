<section id="pane-albums" class="h-full flex flex-col overflow-hidden md:col-span-4 bg-slate-900/60 border-r border-slate-800">
  <!-- スマホ用 戻るナビゲーションバー (STEP 2表示時) -->
  <div id="albums-mobile-back-bar" class="md:hidden px-3 py-2 border-b border-slate-800 bg-slate-950 flex items-center justify-between flex-shrink-0">
    <button id="btn-back-to-artists" class="inline-flex items-center gap-1.5 min-h-[44px] min-w-[44px] px-3 py-2.5 -ml-1 text-xs font-medium text-indigo-400 hover:text-indigo-300 active:scale-95 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
      <span>アーティスト一覧</span>
    </button>
    <span class="text-xs text-slate-500 font-mono">STEP 2 / 3</span>
  </div>

  <!-- アーティスト名ヘッダー (PC / スマホ共通) -->
  <div class="p-3 border-b border-slate-800/80 bg-slate-900/40 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-2 overflow-hidden">
      <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Artist:</span>
      <h2 id="albums-header-artist-name" class="text-sm font-bold text-slate-200 truncate">未選択</h2>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      <span id="album-count-badge" class="px-2 py-0.5 bg-slate-800 text-slate-400 text-xs rounded-full font-mono">
        0作品
      </span>
      <button id="btn-toggle-album-select" type="button" aria-pressed="false" aria-label="アルバム複数選択モード切替" title="複数選択モードに切り替え" class="min-h-[44px] min-w-[44px] px-2.5 py-1 text-xs font-medium rounded-lg text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center gap-1 border border-slate-700">
        <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
        </svg>
        <span id="btn-toggle-album-select-text">選択</span>
      </button>
    </div>
  </div>

  <!-- 選択モード用ツールバー (通常時は hidden) -->
  <div id="album-selection-toolbar" class="hidden px-3 py-2 border-b border-indigo-900/50 bg-indigo-950/30 flex items-center justify-between gap-2 flex-shrink-0 transition-all">
    <div class="flex items-center gap-1.5 flex-wrap">
      <button id="btn-select-all-albums" type="button" class="min-h-[44px] min-w-[44px] px-2.5 py-1 text-xs font-medium rounded text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center">
        全選択
      </button>
      <button id="btn-deselect-all-albums" type="button" class="min-h-[44px] min-w-[44px] px-2.5 py-1 text-xs font-medium rounded text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 active:scale-95 transition flex items-center justify-center">
        全解除
      </button>
      <span id="selected-album-count-badge" class="px-2 py-0.5 bg-indigo-900/60 text-indigo-300 border border-indigo-700/50 text-xs rounded-full font-mono flex items-center">
        0件選択中
      </span>
    </div>
    <button id="btn-delete-selected-albums" type="button" disabled class="min-h-[44px] min-w-[44px] px-3 py-1.5 text-xs font-semibold rounded-lg bg-rose-600/50 text-rose-300 cursor-not-allowed hover:bg-rose-600 hover:text-white active:scale-95 transition flex items-center justify-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
      </svg>
      <span>削除</span>
    </button>
  </div>

  <!-- アルバムカードグリッドスクロールエリア -->
  <div id="album-grid-container" class="flex-1 overflow-y-auto p-3 grid grid-cols-2 gap-3 content-start">
    <!-- 動的レンダリング: <div class="album-card ..."> -->
  </div>

  <!-- 空状態プレースホルダー -->
  <div id="album-empty-state" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center text-slate-500">
    <svg class="w-10 h-10 mb-2 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
    </svg>
    <p class="text-xs">アーティストを選択すると<br>アルバムが表示されます</p>
  </div>
</section>
