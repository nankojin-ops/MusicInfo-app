<script>
/**
 * ユーティリティヘルパークラス
 */
class Utils {
  /**
   * HTML特殊文字のエスケープ処理 (XSS対策)
   * @param {string} str 
   * @returns {string}
   */
  static escapeHtml(str) {
    if (str === null || str === undefined) return '';
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return String(str).replace(/[&<>"']/g, (m) => map[m]);
  }

  /**
   * ISO日付文字列を YYYY-MM-DD に整形
   * @param {string|Date} dateVal 
   * @returns {string}
   */
  static formatDate(dateVal) {
    if (!dateVal) return '';
    if (dateVal instanceof Date || Object.prototype.toString.call(dateVal) === '[object Date]') {
      const y = dateVal.getFullYear();
      const m = String(dateVal.getMonth() + 1).padStart(2, '0');
      const d = String(dateVal.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    return String(dateVal).substring(0, 10);
  }

  /**
   * 関数デバウンス
   * @param {Function} func 
   * @param {number} wait 
   * @returns {Function}
   */
  static debounce(func, wait = 250) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), wait);
    };
  }

  /**
   * トースト通知を表示
   * @param {string} message 
   * @param {'success'|'error'|'info'|'warning'} type 
   * @param {number} duration 
   */
  static showToast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const colorMap = {
      success: 'bg-emerald-600 border-emerald-500 text-white',
      error: 'bg-rose-600 border-rose-500 text-white',
      warning: 'bg-amber-600 border-amber-500 text-white',
      info: 'bg-indigo-600 border-indigo-500 text-white'
    };

    const colorClass = colorMap[type] || colorMap.info;
    toast.className = `px-4 py-2.5 rounded-lg shadow-xl text-xs md:text-sm font-medium border flex items-center gap-2 animate-fadeIn pointer-events-auto transition-all ${colorClass}`;
    toast.innerHTML = `<span>${this.escapeHtml(message)}</span>`;

    container.appendChild(toast);

    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-2');
      setTimeout(() => toast.remove(), 200);
    }, duration);
  }

  /**
   * グローバルローディングの表示/非表示
   * @param {boolean} show 
   * @param {string} text 
   */
  static toggleGlobalLoading(show, text = '処理中...') {
    const el = document.getElementById('global-loading');
    const txtEl = document.getElementById('global-loading-text');
    if (!el) return;

    if (show) {
      if (txtEl) txtEl.textContent = text;
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  /**
   * Google Driveの各種URLまたは文字列からファイルIDを抽出
   * @param {string} url 
   * @returns {string|null}
   */
  static extractDriveFileId(url) {
    if (!url || typeof url !== 'string') return null;
    const str = url.trim();
    if (!str) return null;

    // 1. /file/d/{id}
    const fileDMatch = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/i);
    if (fileDMatch) return fileDMatch[1];

    // 2. id={id} クエリパラメータ (uc?id=, open?id=, thumbnail?id= 等)
    const idParamMatch = str.match(/[?&]id=([a-zA-Z0-9_-]+)/i);
    if (idParamMatch) return idParamMatch[1];

    // 3. googleusercontent.com/d/{id}
    const dMatch = str.match(/googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/i);
    if (dMatch) return dMatch[1];

    // 4. 純粋なファイルID (25文字以上の英数字記号)
    if (/^[a-zA-Z0-9_-]{25,}$/.test(str)) {
      return str;
    }

    return null;
  }

  /**
   * Google Drive等の画像URLをWeb上で確実に表示可能なURLに解決
   * @param {string} url 
   * @param {number} size 
   * @returns {string}
   */
  static resolveArtworkUrl(url, size = 800) {
    if (!url || typeof url !== 'string') return '';
    const trimmed = url.trim();
    if (!trimmed) return '';

    const driveId = this.extractDriveFileId(trimmed);
    if (driveId) {
      return `https://drive.google.com/thumbnail?id=${driveId}&sz=w${size}`;
    }

    return trimmed;
  }

  /**
   * デフォルトのSVGジャケットプレースホルダー (Data URI)
   * @returns {string}
   */
  static getDefaultArtworkSvg() {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5"><rect width="24" height="24" fill="#1e293b"/><circle cx="12" cy="12" r="4"/></svg>'
    );
  }

  /**
   * 画像読み込み失敗時の多重フォールバック処理
   * @param {HTMLImageElement} imgEl 
   * @param {string} [originalUrl] 
   */
  static handleImageError(imgEl, originalUrl) {
    if (!imgEl) return;
    const rawUrl = originalUrl || imgEl.getAttribute('data-artwork') || '';
    const step = parseInt(imgEl.getAttribute('data-error-step') || '0', 10);
    const driveId = this.extractDriveFileId(rawUrl);

    if (driveId && step === 0) {
      imgEl.setAttribute('data-error-step', '1');
      imgEl.src = `https://lh3.googleusercontent.com/d/${driveId}`;
      return;
    }

    // 最終フォールバック (ループ防止のため属性およびハンドラ解除)
    imgEl.setAttribute('data-error-step', '2');
    imgEl.removeAttribute('data-artwork');
    imgEl.onerror = null;
    imgEl.src = this.getDefaultArtworkSvg();
  }
}

if (typeof window !== 'undefined') {
  window.Utils = Utils;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = Utils;
}
</script>
