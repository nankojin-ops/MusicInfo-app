<script>  
/**  
 * ユーティリティヘルパークラス  
 */  
class Utils {  
  /**  
   * HTML特殊文字のエスケープ処理 (XSS対策)  
   * @param {string} str   
   * @returns {string}  
   */  
  static escapeHtml(str) {  
    if (str === null || str === undefined) return '';  
    const map = {  
      '&': '&amp;',  
      '<': '&lt;',  
      '>': '&gt;',  
      '"': '&quot;',  
      "'": '&#039;'  
    };  
    return String(str).replace(/[&<>"']/g, (m) => map[m]);  
  }  

  /**  
   * 検索用文字列の正規化（全角半角統一・カタカナ統一・大文字小文字統一）  
   * @param {string} str   
   * @returns {string}  
   */  
  static normalizeSearchText(str) {  
    if (str === null || str === undefined) return '';  
    // 1. Unicode NFKC (全角英数・記号・半角カナを正規化)  
    let s = String(str).normalize('NFKC').toLowerCase().trim();  
    if (!s) return '';  

    // 2. ひらがな -> 全角カタカナ 変換 (文字コードオフセット 0x60)  
    s = s.replace(/[\u3041-\u3096]/g, (match) => {  
      return String.fromCharCode(match.charCodeAt(0) + 0x60);  
    });  

    // 3. 連続する空白を1個の半角スペースに統一  
    return s.replace(/\s+/g, ' ');  
  }  

  /**  
   * 元テキストに対して直接動的正規表現マッチングを行い、ズレなく安全にハイライトを付与  
   * @param {string} rawText 表示対象の元の生テキスト  
   * @param {Array<string>} queryTokens 検索トークン配列  
   * @returns {string} XSS安全なハイライト付きHTML文字列  
   */  
  static highlightMatch(rawText, queryTokens) {  
    if (!rawText) return '';  
    if (!Array.isArray(queryTokens) || queryTokens.length === 0) {  
      return Utils.escapeHtml(rawText);  
    }  

    // 有効なトークンのみ抽出  
    const validTokens = queryTokens  
      .map(t => String(t || '').trim())  
      .filter(t => t.length > 0);  

    if (validTokens.length === 0) {  
      return Utils.escapeHtml(rawText);  
    }  

    // 1. 各トークンから表記揺れを許容する正規表現パターン文字列を構築  
    const patternParts = validTokens.map(token => {  
      let pattern = '';  
      for (let i = 0; i < token.length; i++) {  
        const char = token[i];  
        // 正規表現メタ文字のエスケープ  
        if (/[.*+?^${}()|[\]\\]/.test(char)) {  
          pattern += '\\' + char;  
          continue;  
        }  
        const code = char.charCodeAt(0);  
        // カタカナ (0x30A1 - 0x30F6) -> ひらがなも許容  
        if (code >= 0x30A1 && code <= 0x30F6) {  
          const hira = String.fromCharCode(code - 0x60);  
          pattern += `[${char}${hira}]`;  
        }  
        // ひらがな (0x3041 - 0x3096) -> カタカナも許容  
        else if (code >= 0x3041 && code <= 0x3096) {  
          const kata = String.fromCharCode(code + 0x60);  
          pattern += `[${char}${kata}]`;  
        } else {  
          pattern += char;  
        }  
      }  
      return pattern;  
    });  

    // 2. 各トークンパターンごとに元文字列上で直接マッチ区間 (start, end) を収集  
    const matches = [];  
    for (const pattern of patternParts) {  
      let regex;  
      try {  
        regex = new RegExp(pattern, 'gi');  
      } catch (e) {  
        continue;  
      }  
      let match;  
      while ((match = regex.exec(rawText)) !== null) {  
        if (match[0].length === 0) {  
          regex.lastIndex++;  
          continue;  
        }  
        matches.push({ start: match.index, end: match.index + match[0].length });  
      }  
    }  

    if (matches.length === 0) {  
      return Utils.escapeHtml(rawText);  
    }  

    // 3. 重複・隣接区間のマージ  
    matches.sort((a, b) => a.start - b.start);  
    const merged = [matches[0]];  
    for (let i = 1; i < matches.length; i++) {  
      const cur = matches[i];  
      const prev = merged[merged.length - 1];  
      if (cur.start <= prev.end) {  
        prev.end = Math.max(prev.end, cur.end);  
      } else {  
        merged.push(cur);  
      }  
    }  

    // 4. 元テキストを切り出し、エスケープしながら HTML 組み立て  
    let html = '';  
    let lastIdx = 0;  
    for (const m of merged) {  
      if (m.start > lastIdx) {  
        html += Utils.escapeHtml(rawText.substring(lastIdx, m.start));  
      }  
      html += `<mark class="bg-indigo-500/30 text-indigo-200 rounded px-0.5 font-bold">${Utils.escapeHtml(rawText.substring(m.start, m.end))}</mark>`;  
      lastIdx = m.end;  
    }  
    if (lastIdx < rawText.length) {  
      html += Utils.escapeHtml(rawText.substring(lastIdx));  
    }  

    return html;  
  }  

  /**  
   * HTML5 Canvas を用いた画像のクライアント側リサイズ＆JPEG圧縮  
   * @param {File} file - ユーザー選択ファイル  
   * @param {Object} [options]  
   * @param {number} [options.maxWidth=800] - 最大幅  
   * @param {number} [options.maxHeight=800] - 最大高さ  
   * @param {number} [options.quality=0.85] - JPEG品質 (0.0〜1.0)  
   * @returns {Promise<string>} Base64 DataURL (image/jpeg)  
   */  
  static async resizeImage(file, options = {}) {  
    const maxWidth = options.maxWidth || 800;  
    const maxHeight = options.maxHeight || 800;  
    const quality = options.quality !== undefined ? options.quality : 0.85;  

    return new Promise((resolve, reject) => {  
      if (!file) return reject(new Error('ファイルが指定されていません。'));  

      // Canvas / DOM 未対応環境の場合は Base64 読み取りへフォールバック  
      if (typeof document === 'undefined' || typeof Image === 'undefined') {  
        return Utils.readFileAsBase64(file).then(resolve).catch(reject);  
      }  

      const reader = new FileReader();  
      reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました。'));  
      reader.onload = (e) => {  
        const img = new Image();  
        img.onerror = () => {  
          // 画像デコード失敗時は元データの DataURL を返却  
          resolve(e.target.result);  
        };  
        img.onload = () => {  
          try {  
            let width = img.width;  
            let height = img.height;  

            // アスペクト比維持のリサイズ計算  
            if (width > maxWidth || height > maxHeight) {  
              if (width / height > maxWidth / maxHeight) {  
                height = Math.round((height * maxWidth) / width);  
                width = maxWidth;  
              } else {  
                width = Math.round((width * maxHeight) / height);  
                height = maxHeight;  
              }  
            }  

            const canvas = document.createElement('canvas');  
            canvas.width = width;  
            canvas.height = height;  
            const ctx = canvas.getContext('2d');  

            // 透過PNG対応: 背景を白で塗りつぶす  
            ctx.fillStyle = '#FFFFFF';  
            ctx.fillRect(0, 0, width, height);  

            // 画像を描画  
            ctx.drawImage(img, 0, 0, width, height);  

            // JPEG で圧縮出力  
            const dataUrl = canvas.toDataURL('image/jpeg', quality);  
            resolve(dataUrl);  
          } catch (err) {  
            // Canvas 処理例外時は元画像の DataURL を返却  
            resolve(e.target.result);  
          }  
        };  
        img.src = e.target.result;  
      };  
      reader.readAsDataURL(file);  
    });  
  }  

  /**  
   * ISO日付文字列を YYYY-MM-DD に整形  
   * @param {string|Date} dateVal   
   * @returns {string}  
   */  
  static formatDate(dateVal) {  
    if (!dateVal) return '';  
    if (dateVal instanceof Date || Object.prototype.toString.call(dateVal) === '[object Date]') {  
      const y = dateVal.getFullYear();  
      const m = String(dateVal.getMonth() + 1).padStart(2, '0');  
      const d = String(dateVal.getDate()).padStart(2, '0');  
      return `${y}-${m}-${d}`;  
    }  
    return String(dateVal).substring(0, 10);  
  }  

  /**  
   * 関数デバウンス  
   * @param {Function} func   
   * @param {number} wait   
   * @returns {Function}  
   */  
  static debounce(func, wait = 250) {  
    let timeout;  
    return function(...args) {  
      clearTimeout(timeout);  
      timeout = setTimeout(() => func.apply(this, args), wait);  
    };  
  }  

  /**  
   * トースト通知を表示  
   * @param {string} message   
   * @param {'success'|'error'|'info'|'warning'} type   
   * @param {number} duration   
   */  
  static showToast(message, type = 'info', duration = 3000) {  
    const container = document.getElementById('toast-container');  
    if (!container) return;  

    const toast = document.createElement('div');  
    const colorMap = {  
      success: 'bg-emerald-600 border-emerald-500 text-white',  
      error: 'bg-rose-600 border-rose-500 text-white',  
      warning: 'bg-amber-600 border-amber-500 text-white',  
      info: 'bg-indigo-600 border-indigo-500 text-white'  
    };  

    const colorClass = colorMap[type] || colorMap.info;  
    toast.className = `px-4 py-2.5 rounded-lg shadow-xl text-xs md:text-sm font-medium border flex items-center gap-2 animate-fadeIn pointer-events-auto transition-all ${colorClass}`;  
    toast.innerHTML = `<span>${this.escapeHtml(message)}</span>`;  

    container.appendChild(toast);  

    setTimeout(() => {  
      toast.classList.add('opacity-0', 'translate-y-2');  
      setTimeout(() => toast.remove(), 200);  
    }, duration);  
  }  

  /**  
   * グローバルローディングの表示/非表示  
   * @param {boolean} show   
   * @param {string} text   
   */  
  static toggleGlobalLoading(show, text = '処理中...') {  
    const el = document.getElementById('global-loading');  
    const txtEl = document.getElementById('global-loading-text');  
    if (!el) return;  

    if (show) {  
      if (txtEl) txtEl.textContent = text;  
      el.classList.remove('hidden');  
    } else {  
      el.classList.add('hidden');  
    }  
  }  

  /**  
   * Google Driveの各種URLまたは文字列からファイルIDを抽出  
   * @param {string} url   
   * @returns {string|null}  
   */  
  static extractDriveFileId(url) {  
    if (!url || typeof url !== 'string') return null;  
    const str = url.trim();  
    if (!str) return null;  

    // 1. /file/d/{id}  
    const fileDMatch = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/i);  
    if (fileDMatch) return fileDMatch[1];  

    // 2. id={id} クエリパラメータ (uc?id=, open?id=, thumbnail?id= 等)  
    const idParamMatch = str.match(/[?&]id=([a-zA-Z0-9_-]+)/i);  
    if (idParamMatch) return idParamMatch[1];  

    // 3. googleusercontent.com/d/{id}  
    const dMatch = str.match(/googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/i);  
    if (dMatch) return dMatch[1];  

    // 4. 純粋なファイルID (25文字以上の英数字記号)  
    if (/^[a-zA-Z0-9_-]{25,}$/.test(str)) {  
      return str;  
    }  

    return null;  
  }  

  /**  
   * Google Drive等の画像URLをWeb上で確実に表示可能なURLに解決  
   * 優先URL: https://lh3.googleusercontent.com/d/{fileId}  
   * @param {string} url   
   * @param {number} [size=800]   
   * @returns {string}  
   */  
  static resolveArtworkUrl(url, size = 800) {  
    if (!url || typeof url !== 'string') return '';  
    const trimmed = url.trim();  
    if (!trimmed) return '';  

    const driveId = this.extractDriveFileId(trimmed);  
    if (driveId) {  
      return 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(driveId);  
    }  

    return trimmed;  
  }  

  /**  
   * デフォルトのSVGジャケットプレースホルダー (Data URI)  
   * @returns {string}  
   */  
  static getDefaultArtworkSvg() {  
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(  
      '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5"><rect width="24" height="24" fill="#1e293b"/><circle cx="12" cy="12" r="4"/></svg>'  
    );  
  }  

  /**  
   * 画像読み込み失敗時の多重フォールバック処理 (3段階保証)  
   * Step 0 (初発): data-error-step="1" に更新し、予備ホスト (drive.google.com/thumbnail) へ切り替え  
   * Step 1 (予備失敗) または Drive以外の画像エラー: data-error-step="2" に更新し、getDefaultArtworkSvg() をセット。ループ防止のため onerror 解除  
   * @param {HTMLImageElement} imgEl   
   * @param {string} [originalUrl]   
   */  
  static handleImageError(imgEl, originalUrl) {  
    if (!imgEl) return;  
    const rawUrl = originalUrl || imgEl.getAttribute('data-artwork') || '';  
    const step = parseInt(imgEl.getAttribute('data-error-step') || '0', 10);  
    const driveId = this.extractDriveFileId(rawUrl);  

    if (driveId && step === 0) {  
      imgEl.setAttribute('data-error-step', '1');  
      imgEl.src = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(driveId) + '&sz=w400';  
      return;  
    }  

    // 最終フォールバック (ループ防止のため属性およびハンドラ解除)  
    imgEl.setAttribute('data-error-step', '2');  
    imgEl.removeAttribute('data-artwork');  
    imgEl.onerror = null;  
    imgEl.src = this.getDefaultArtworkSvg();  
  }  

  /**  
   * アップロード対象画像ファイルのクライアント側バリデーション  
   * @param {File} file   
   * @returns {{ valid: boolean, error?: string, mimeType?: string, extension?: string }}  
   */  
  static validateImageFile(file) {  
    if (!file) {  
      return { valid: false, error: 'ファイルが選択されていません。' };  
    }  
    const maxSize = 5 * 1024 * 1024; // 5MB  
    if (file.size > maxSize) {  
      return { valid: false, error: '画像サイズは5MB以内にしてください。' };  
    }  
    const allowedMimes = ['image/jpeg', 'image/png', 'image/webp'];  
    let mime = (file.type || '').toLowerCase();  
    // 拡張子からのフォールバック判定  
    const name = file.name || '';  
    const extMatch = name.match(/\.([a-zA-Z0-9]+)$/);  
    const ext = extMatch ? extMatch[1].toLowerCase() : '';  
    if (!mime) {  
      if (ext === 'jpg' || ext === 'jpeg') mime = 'image/jpeg';  
      else if (ext === 'png') mime = 'image/png';  
      else if (ext === 'webp') mime = 'image/webp';  
    }  
    if (!allowedMimes.includes(mime)) {  
      return { valid: false, error: '対応形式はJPEG、PNG、WebPのみです。' };  
    }  
    const extMapping = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };  
    return { valid: true, mimeType: mime, extension: extMapping[mime] || 'jpg' };  
  }  

  /**  
   * File オブジェクトを Base64 DataURL 文字列として読み込む  
   * @param {File} file   
   * @returns {Promise<string>}  
   */  
  static readFileAsBase64(file) {  
    return new Promise((resolve, reject) => {  
      if (!file) {  
        return reject(new Error('ファイルが指定されていません。'));  
      }  
      if (typeof FileReader === 'undefined') {
        return resolve('data:' + (file.type || 'image/jpeg') + ';base64,');
      }
      const reader = new FileReader();  
      reader.onload = () => resolve(reader.result);  
      reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました。'));  
      reader.readAsDataURL(file);  
    });  
  }  
}  

if (typeof window !== 'undefined') {  
  window.Utils = Utils;  
}  

if (typeof module !== 'undefined' && module.exports) {  
  module.exports = Utils;  
}  
</script>
