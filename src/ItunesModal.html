<div id="modal-itunes" class="hidden fixed inset-0 z-50 flex items-center justify-center p-2 md:p-4 bg-slate-950/80 backdrop-blur-sm">
  <div class="w-full max-w-4xl h-[92vh] md:h-[85vh] bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-modalScale">
    
    <!-- モーダルヘッダー -->
    <div class="px-3 sm:px-4 py-2.5 sm:py-3 border-b border-slate-800 flex items-center justify-between gap-2 bg-slate-950 flex-shrink-0">
      <div class="flex items-center gap-2 min-w-0 flex-wrap">
        <div class="w-6 h-6 rounded bg-indigo-600 flex items-center justify-center text-white flex-shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <h3 class="text-sm md:text-base font-bold text-slate-100">アルバムを検索して一括登録</h3>
        <span class="text-[11px] font-normal text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700/80 font-mono">iTunes / MusicBrainz</span>
      </div>
      <button id="btn-close-itunes-modal" class="min-h-[44px] min-w-[44px] flex items-center justify-center text-slate-400 hover:text-slate-200 p-1 rounded-lg hover:bg-slate-800 transition flex-shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- 検索入力バー -->
    <div class="p-2.5 sm:p-3 border-b border-slate-800 bg-slate-900/90 flex gap-2 flex-shrink-0">
      <input type="text" id="itunes-search-input" placeholder="アーティスト名、アルバム名を入力..."
        class="min-h-[44px] flex-1 min-w-0 px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
      <button id="btn-itunes-search-submit" class="min-h-[44px] px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-lg transition active:scale-95 flex items-center justify-center gap-1.5 whitespace-nowrap flex-shrink-0">
        <span id="itunes-search-btn-text">検索</span>
        <div id="itunes-search-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </div>

    <!-- メインコンテンツ 2ペイン（PC: 左右同時表示 / モバイル: 結果↔プレビュー排他切替） -->
    <div class="flex-1 min-h-0 overflow-hidden grid grid-cols-1 md:grid-cols-12 md:divide-x divide-slate-800">
      
      <!-- 検索結果リスト (PC: col-span-5) -->
      <div id="itunes-results-container" class="h-full min-h-0 overflow-y-auto md:block md:col-span-5 divide-y divide-slate-800/60 p-1">
        <!-- 候補リスト動的生成 -->
        <div id="itunes-results-placeholder" class="p-8 text-center text-slate-500 text-xs">
          キーワードを入力して検索してください
        </div>
      </div>

      <!-- トラックプレビューパネル (PC: col-span-7) -->
      <div id="itunes-preview-panel" class="hidden md:flex h-full min-h-0 overflow-y-auto md:col-span-7 bg-slate-950/60 p-3 md:p-4 flex-col">
        <!-- スマホ用 検索結果一覧へ戻るバー (<768px) -->
        <div id="itunes-mobile-back-bar" class="md:hidden pb-2 mb-3 border-b border-slate-800 flex items-center justify-between flex-shrink-0">
          <button id="btn-itunes-mobile-back" class="inline-flex items-center gap-1.5 min-h-[44px] min-w-[44px] px-2.5 py-2 -ml-1 text-xs font-medium text-indigo-400 hover:text-indigo-300 active:scale-95 transition">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span class="whitespace-nowrap">検索結果一覧へ</span>
          </button>
          <span class="text-xs text-slate-500 font-mono">収録曲プレビュー</span>
        </div>

        <div id="itunes-preview-empty" class="flex-1 flex flex-col items-center justify-center text-center text-slate-500 text-xs">
          左のリストからアルバムを選択すると<br>収録曲プレビューが表示されます
        </div>

        <div id="itunes-preview-content" class="hidden md:flex-1 md:min-h-0 flex flex-col">
          <!-- プレビューヘッダー -->
          <div class="flex gap-3 items-start sm:items-center mb-3 pb-3 border-b border-slate-800 flex-shrink-0">
            <img id="itunes-preview-artwork" src="" class="w-16 h-16 flex-shrink-0 rounded-lg object-cover bg-slate-800 border border-slate-700">
            <div class="min-w-0 flex-1">
              <h4 id="itunes-preview-album" class="text-sm md:text-base font-bold text-slate-100 break-words [overflow-wrap:anywhere] md:truncate"></h4>
              <p id="itunes-preview-artist" class="text-xs text-indigo-400 font-medium break-words [overflow-wrap:anywhere] md:truncate"></p>
              <p id="itunes-preview-meta" class="text-xs text-slate-500 font-mono mt-0.5"></p>
            </div>
          </div>

          <!-- プレビュートラックテーブル -->
          <div class="md:flex-1 md:min-h-0 md:overflow-y-auto md:pr-1">
            <table class="w-full table-fixed text-left text-xs text-slate-300">
              <thead class="sticky top-0 bg-slate-900 text-slate-400 uppercase text-[10px] font-mono border-b border-slate-800">
                <tr>
                  <th class="py-1.5 px-1.5 w-11 sm:w-14 text-center">CD</th>
                  <th class="py-1.5 px-1.5 w-8 sm:w-10 text-center">No</th>
                  <th class="py-1.5 px-2">曲名</th>
                  <th class="hidden sm:table-cell py-1.5 px-2 sm:w-[35%] md:w-[36%]">アーティスト</th>
                </tr>
              </thead>
              <tbody id="itunes-preview-tracks-tbody" class="divide-y divide-slate-800/40">
                <!-- 動的生成 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <!-- モーダルフッター -->
    <div class="px-3 sm:px-4 py-3 border-t border-slate-800 bg-slate-950 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2.5 flex-shrink-0">
      <span id="itunes-selected-summary" class="text-xs text-slate-400 font-mono truncate min-w-0 sm:flex-1">
        アルバムを選択してください
      </span>
      <div class="flex items-center justify-end gap-2 flex-shrink-0">
        <button id="btn-cancel-itunes-modal" class="min-h-[44px] px-3 py-2 text-xs text-slate-400 hover:text-slate-200 border border-slate-800 hover:bg-slate-800 rounded-lg transition whitespace-nowrap flex-shrink-0">
          キャンセル
        </button>
        <button id="btn-submit-itunes-batch" disabled class="min-h-[44px] px-4 py-2 text-xs font-semibold bg-indigo-600 disabled:bg-slate-800 disabled:text-slate-600 hover:bg-indigo-500 text-white rounded-lg shadow transition flex items-center justify-center gap-1.5 whitespace-nowrap flex-shrink-0">
          <span id="itunes-batch-btn-text">このアルバムを一括登録</span>
          <div id="itunes-batch-spinner" class="hidden w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </div>
    </div>

  </div>
</div>
