<script>  
/**  
 * アプリケーションコントローラークラス  
 */  
class App {  
  constructor() {  
    this.store = new Store();  
    this.api = new ApiClient();  
    this.hasManualSaved = false;  
    this.lastManualAlbumArtist = null;  
    this.lastManualAlbumName = null;  
    this.editingOriginalReleaseDate = '';  
    this.editingReleaseDateChanged = false;  

    // キーボード操作・検索UI管理状態  
    this.focusedSearchIndex = -1;  
    this.currentSearchTarget = 'pc'; // 'pc' | 'mobile'  
    this.driveArtworkContext = null; // 'editAlbum' | 'manual'  
    this.isDeletingAlbums = false; // アルバム削除API通信待機中フラグ (BUG-002)
  }  

  /**  
   * アプリケーション初期化  
   */  
  async init() {  
    this.bindEvents();  
    this.handleResize();  
    await this.loadInitialData();  
  }  

  /**  
   * 全DOMイベントリスナーの登録  
   */  
  bindEvents() {  
    // 画像読み込みエラーのグローバルフォールバック処理  
    window.addEventListener(  
      'error',  
      (e) => {  
        const target = e.target;  
        if (target && target.tagName === 'IMG' && target.hasAttribute('data-artwork')) {  
          Utils.handleImageError(target);  
        }  
      },  
      true  
    );  

    // ウィンドウリサイズ  
    window.addEventListener('resize', Utils.debounce(() => this.handleResize(), 150));  

    // 検索ドロップダウンの外部クリック（Outside Click）制御  
    document.addEventListener('click', (e) => {  
      const pcDropdown = document.getElementById('pc-search-dropdown');  
      const mobileDropdown = document.getElementById('mobile-search-dropdown');  
      const pcInput = document.getElementById('header-search-input');  
      const mobileInput = document.getElementById('mobile-search-input');  

      if (pcDropdown && !pcDropdown.classList.contains('hidden')) {  
        if (!pcDropdown.contains(e.target) && e.target !== pcInput) {  
          this.closeSearchDropdown('pc');  
        }  
      }  
      if (mobileDropdown && !mobileDropdown.classList.contains('hidden')) {  
        if (!mobileDropdown.contains(e.target) && e.target !== mobileInput) {  
          this.closeSearchDropdown('mobile');  
        }  
      }  
    });  

    // 検索入力欄にフォーカスした際、入力値があればドロップダウンを再表示  
    const reopenDropdown = (target, inputEl) => {  
      if (inputEl && inputEl.value.trim()) {  
        this.handleGlobalSearch(inputEl.value, target);  
      }  
    };  

    // PC用 全体クイック検索  
    const headerSearch = document.getElementById('header-search-input');  
    const headerClear = document.getElementById('header-search-clear');  
    if (headerSearch) {  
      headerSearch.addEventListener('input', Utils.debounce((e) => {  
        this.handleGlobalSearch(e.target.value, 'pc');  
        if (headerClear) headerClear.classList.toggle('hidden', !e.target.value);  
      }, 180));  

      headerSearch.addEventListener('focus', (e) => reopenDropdown('pc', e.target));  

      // キーボードナビゲーション (IME確定と衝突防止)  
      headerSearch.addEventListener('keydown', (e) => this.handleSearchKeydown(e, 'pc'));  
    }  

    if (headerClear) {  
      headerClear.addEventListener('click', () => {  
        if (headerSearch) {  
          headerSearch.value = '';  
          headerSearch.focus();  
        }  
        headerClear.classList.add('hidden');  
        this.closeSearchDropdown('pc');  
      });  
    }  

    // スマホ用 全体クイック検索  
    const mobileSearch = document.getElementById('mobile-search-input');  
    const mobileClear = document.getElementById('mobile-search-clear');  
    if (mobileSearch) {  
      mobileSearch.addEventListener('input', Utils.debounce((e) => {  
        this.handleGlobalSearch(e.target.value, 'mobile');  
        if (mobileClear) mobileClear.classList.toggle('hidden', !e.target.value);  
      }, 180));  

      mobileSearch.addEventListener('focus', (e) => reopenDropdown('mobile', e.target));  

      // キーボードナビゲーション (IME確定と衝突防止)  
      mobileSearch.addEventListener('keydown', (e) => this.handleSearchKeydown(e, 'mobile'));  
    }  

    if (mobileClear) {  
      mobileClear.addEventListener('click', () => {  
        if (mobileSearch) {  
          mobileSearch.value = '';  
          mobileSearch.focus();  
        }  
        mobileClear.classList.add('hidden');  
        this.closeSearchDropdown('mobile');  
      });  
    }  

    // STEP 1 アーティスト絞り込み  
    const artistFilter = document.getElementById('artist-filter-input');  
    const artistFilterClear = document.getElementById('artist-filter-clear');  
    if (artistFilter) {  
      artistFilter.addEventListener('input', (e) => {  
        this.store.state.artistFilter = e.target.value;  
        if (artistFilterClear) artistFilterClear.classList.toggle('hidden', !e.target.value);  
        this.renderArtistList();  
      });  
    }  
    if (artistFilterClear) {  
      artistFilterClear.addEventListener('click', () => {  
        if (artistFilter) artistFilter.value = '';  
        artistFilterClear.classList.add('hidden');  
        this.store.state.artistFilter = '';  
        this.renderArtistList();  
      });  
    }  

    // ナビゲーション戻るボタン  
    const btnBackToArtists = document.getElementById('btn-back-to-artists');  
    if (btnBackToArtists) {  
      btnBackToArtists.addEventListener('click', () => this.setMobileStep(1));  
    }  
    const btnBackToAlbums = document.getElementById('btn-back-to-albums');  
    if (btnBackToAlbums) {  
      btnBackToAlbums.addEventListener('click', () => this.setMobileStep(2));  
    }  

    // 再読み込みボタン  
    const btnReload = document.getElementById('btn-reload-data');  
    if (btnReload) {  
      btnReload.addEventListener('click', () => this.loadInitialData());  
    }  

    // iTunes モーダル開閉  
    const btnOpenItunes = document.getElementById('btn-open-itunes-modal');  
    if (btnOpenItunes) btnOpenItunes.addEventListener('click', () => this.openItunesModal());  
    const btnCloseItunes = document.getElementById('btn-close-itunes-modal');  
    if (btnCloseItunes) btnCloseItunes.addEventListener('click', () => this.closeItunesModal());  
    const btnCancelItunes = document.getElementById('btn-cancel-itunes-modal');  
    if (btnCancelItunes) btnCancelItunes.addEventListener('click', () => this.closeItunesModal());  

    // iTunes 検索実行  
    const btnSearchItunes = document.getElementById('btn-itunes-search-submit');  
    const inputSearchItunes = document.getElementById('itunes-search-input');  
    if (btnSearchItunes) btnSearchItunes.addEventListener('click', () => this.executeItunesSearch());  
    if (inputSearchItunes) {  
      inputSearchItunes.addEventListener('keydown', (e) => {  
        if (e.key === 'Enter') this.executeItunesSearch();  
      });  
    }  

    // iTunes 一括登録確定  
    const btnSubmitItunes = document.getElementById('btn-submit-itunes-batch');  
    if (btnSubmitItunes) btnSubmitItunes.addEventListener('click', () => this.submitItunesBatch());  

    // 手動登録 モーダル開閉  
    const btnOpenManual = document.getElementById('btn-open-manual-modal');  
    if (btnOpenManual) btnOpenManual.addEventListener('click', () => this.openManualModal());  
    const btnCloseManual = document.getElementById('btn-close-manual-modal');  
    if (btnCloseManual) btnCloseManual.addEventListener('click', () => this.closeManualModal());  
    const btnCancelManual = document.getElementById('btn-cancel-manual-modal');  
    if (btnCancelManual) btnCancelManual.addEventListener('click', () => this.closeManualModal());  

    // アルバム詳細内の「+ 曲追加」ボタン  
    const btnAddTrackToAlbum = document.getElementById('btn-add-track-to-album');  
    if (btnAddTrackToAlbum) {  
      btnAddTrackToAlbum.addEventListener('click', () => {  
        const curAlbum = this.store.getSelectedAlbumData();  
        if (curAlbum) {  
          this.openManualModal({  
            albumArtist: curAlbum.albumArtist,  
            albumName: curAlbum.albumName,  
            releaseDate: curAlbum.releaseDate,  
            artworkUrl: curAlbum.artworkUrl,  
            cdNumber: 1,  
            trackNumber: curAlbum.totalTracks + 1  
          });  
        } else {  
          this.openManualModal();  
        }  
      });  
    }  

    // 手動登録 送信  
    const formManual = document.getElementById('form-manual-track');  
    if (formManual) {  
      formManual.addEventListener('submit', (e) => {  
        e.preventDefault();  
        this.submitManualTrack();  
      });  
    }  
    const btnSubmitManual = document.getElementById('btn-submit-manual-track');  
    if (btnSubmitManual) btnSubmitManual.addEventListener('click', () => this.submitManualTrack());  

    // アルバムアート拡大  
    const btnZoomArtwork = document.getElementById('btn-zoom-track-artwork');  
    if (btnZoomArtwork) {  
      btnZoomArtwork.addEventListener('click', () => {  
        const album = this.store.getSelectedAlbumData();  
        if (album && album.artworkUrl) {  
          this.openImageModal(album.artworkUrl, `${album.albumArtist} - ${album.albumName}`);  
        }  
      });  
    }  
    const btnCloseImage = document.getElementById('btn-close-image-modal');  
    if (btnCloseImage) btnCloseImage.addEventListener('click', () => this.closeImageModal());  

    // アルバム詳細内の「このアルバムを編集」ボタン  
    const btnEditAlbum = document.getElementById('btn-edit-album');  
    if (btnEditAlbum) {  
      btnEditAlbum.addEventListener('click', () => {  
        const album = this.store.getSelectedAlbumData();  
        if (album) {  
          this.openEditAlbumModal(album);  
        } else {  
          Utils.showToast('編集対象のアルバムが選択されていません', 'warning');  
        }  
      });  
    }  

    // アルバム編集 モーダル開閉  
    const btnCloseEdit = document.getElementById('btn-close-edit-album');  
    if (btnCloseEdit) btnCloseEdit.addEventListener('click', () => this.closeEditAlbumModal());  
    const btnCancelEdit = document.getElementById('btn-cancel-edit-album');  
    if (btnCancelEdit) btnCancelEdit.addEventListener('click', () => this.closeEditAlbumModal());  

    // アルバム編集 リリース日変更検知  
    const editDateInput = document.getElementById('edit-album-release-date');  
    if (editDateInput) {  
      const markDateChanged = () => {  
        this.editingReleaseDateChanged = true;  
      };  
      editDateInput.addEventListener('change', markDateChanged);  
      editDateInput.addEventListener('input', markDateChanged);  
    }  

    // アルバム編集 アートワークURL変更時のリアルタイムプレビュー  
    const editArtUrlInput = document.getElementById('edit-album-artwork-url');  
    const editArtPreview = document.getElementById('edit-album-art-preview');  
    if (editArtUrlInput && editArtPreview) {  
      editArtUrlInput.addEventListener('input', Utils.debounce((e) => {  
        const url = (e.target.value || '').trim();  
        editArtPreview.onerror = () => {  
          editArtPreview.src = Utils.getDefaultArtworkSvg();  
        };  
        const resolved = url ? Utils.resolveArtworkUrl(url, 400) : '';  
        editArtPreview.src = resolved || Utils.getDefaultArtworkSvg();  
      }, 300));  
    }  

    // アルバム編集 トラック追加ボタン  
    const btnAddEditTrack = document.getElementById('btn-add-edit-track');  
    if (btnAddEditTrack) {  
      btnAddEditTrack.addEventListener('click', () => this.addEditTrackRow());  
    }  

    // アルバム編集 自動連番採番ボタン  
    const btnRenumberEditTracks = document.getElementById('btn-renumber-edit-tracks');  
    if (btnRenumberEditTracks) {  
      btnRenumberEditTracks.addEventListener('click', () => this.renumberEditTracks());  
    }  

    // アルバム編集 フォーム送信抑止  
    const formEditAlbum = document.getElementById('form-edit-album');  
    if (formEditAlbum) {  
      formEditAlbum.addEventListener('submit', (e) => {  
        e.preventDefault();  
        this.handleSaveAlbumEdit();  
      });  
    }  

    // アルバム編集 保存ボタン  
    const btnSubmitEdit = document.getElementById('btn-submit-edit-album');  
    if (btnSubmitEdit) {  
      btnSubmitEdit.addEventListener('click', () => this.handleSaveAlbumEdit());  
    }  
    const btnMobileSubmitEdit = document.getElementById('btn-mobile-submit-edit-album');  
    if (btnMobileSubmitEdit) {  
      btnMobileSubmitEdit.addEventListener('click', () => this.handleSaveAlbumEdit());  
    }  

    // 手動登録 アートワークURL変更時のリアルタイムプレビュー  
    const manualArtUrlInput = document.getElementById('manual-artwork-url');  
    const manualArtPreview = document.getElementById('manual-art-preview');  
    if (manualArtUrlInput && manualArtPreview) {  
      manualArtUrlInput.addEventListener('input', Utils.debounce((e) => {  
        const url = (e.target.value || '').trim();  
        manualArtPreview.onerror = () => {  
          manualArtPreview.src = Utils.getDefaultArtworkSvg();  
        };  
        const resolved = url ? Utils.resolveArtworkUrl(url, 200) : '';  
        manualArtPreview.src = resolved || Utils.getDefaultArtworkSvg();  
      }, 300));  
    }  

    // アルバム編集 ローカル画像選択 & Drive追加ボタン  
    const btnEditAlbumUpload = document.getElementById('btn-edit-album-upload');  
    const editAlbumFileInput = document.getElementById('edit-album-file-input');  
    if (btnEditAlbumUpload && editAlbumFileInput) {  
      btnEditAlbumUpload.addEventListener('click', () => editAlbumFileInput.click());  
      editAlbumFileInput.addEventListener('change', (e) => this.handleImageUpload(e, 'editAlbum'));  
    }  
    const btnEditAlbumDrive = document.getElementById('btn-edit-album-drive');  
    if (btnEditAlbumDrive) {  
      btnEditAlbumDrive.addEventListener('click', () => this.openDriveArtworkModal('editAlbum'));  
    }  

    // 手動登録 ローカル画像選択 & Drive追加ボタン  
    const btnManualUpload = document.getElementById('btn-manual-upload');  
    const manualFileInput = document.getElementById('manual-file-input');  
    if (btnManualUpload && manualFileInput) {  
      btnManualUpload.addEventListener('click', () => manualFileInput.click());  
      manualFileInput.addEventListener('change', (e) => this.handleImageUpload(e, 'manual'));  
    }  
    const btnManualDrive = document.getElementById('btn-manual-drive');  
    if (btnManualDrive) {  
      btnManualDrive.addEventListener('click', () => this.openDriveArtworkModal('manual'));  
    }  

    // Drive画像追加モーダル イベント  
    const btnCloseDrive = document.getElementById('btn-close-drive-artwork');  
    if (btnCloseDrive) btnCloseDrive.addEventListener('click', () => this.closeDriveArtworkModal());  
    const btnCancelDrive = document.getElementById('btn-cancel-drive-artwork');  
    if (btnCancelDrive) btnCancelDrive.addEventListener('click', () => this.closeDriveArtworkModal());  
    const formDrive = document.getElementById('form-drive-artwork');  
    if (formDrive) {  
      formDrive.addEventListener('submit', (e) => {  
        e.preventDefault();  
        this.submitDriveArtwork();  
      });  
    }  
    const btnSubmitDrive = document.getElementById('btn-submit-drive-artwork');  
    if (btnSubmitDrive) {  
      btnSubmitDrive.addEventListener('click', () => this.submitDriveArtwork());  
    }  

    // アルバム複数選択モードトグル
    const btnToggleSelect = document.getElementById('btn-toggle-album-select');
    if (btnToggleSelect) {
      btnToggleSelect.addEventListener('click', () => this.toggleAlbumSelectMode());
    }

    // 全選択 / 全解除
    const btnSelectAll = document.getElementById('btn-select-all-albums');
    if (btnSelectAll) {
      btnSelectAll.addEventListener('click', () => this.selectAllAlbums());
    }
    const btnDeselectAll = document.getElementById('btn-deselect-all-albums');
    if (btnDeselectAll) {
      btnDeselectAll.addEventListener('click', () => this.deselectAllAlbums());
    }

    // 選択アルバム一括削除ボタン（STEP 2 ツールバー内）
    const btnDeleteSelected = document.getElementById('btn-delete-selected-albums');
    if (btnDeleteSelected) {
      btnDeleteSelected.addEventListener('click', () => {
        const albums = this.getSelectedAlbumsForDeletion();
        if (albums.length > 0) {
          this.openDeleteConfirmModal(albums);
        } else {
          Utils.showToast('削除対象のアルバムが選択されていません', 'warning');
        }
      });
    }

    // 個別アルバム削除ボタン（STEP 3 ヘッダー内）
    const btnDeleteAlbum = document.getElementById('btn-delete-album');
    if (btnDeleteAlbum) {
      btnDeleteAlbum.addEventListener('click', () => {
        const album = this.store.getSelectedAlbumData();
        if (album) {
          this.openDeleteConfirmModal([{
            albumArtist: album.albumArtist,
            albumName: album.albumName,
            totalTracks: album.totalTracks
          }]);
        } else {
          Utils.showToast('削除対象のアルバムが選択されていません', 'warning');
        }
      });
    }

    // アルバム削除確認モーダル イベント
    const btnCloseDelete = document.getElementById('btn-close-delete-confirm');
    if (btnCloseDelete) btnCloseDelete.addEventListener('click', () => this.closeDeleteConfirmModal());
    const btnCancelDelete = document.getElementById('btn-cancel-delete-album');
    if (btnCancelDelete) btnCancelDelete.addEventListener('click', () => this.closeDeleteConfirmModal());
    const modalDelete = document.getElementById('modal-delete-confirm');
    if (modalDelete) {
      modalDelete.addEventListener('click', (e) => {
        if (e.target === modalDelete) {
          this.closeDeleteConfirmModal();
        }
      });
    }
    const formDelete = document.getElementById('form-delete-confirm');
    if (formDelete) {
      formDelete.addEventListener('submit', (e) => {
        e.preventDefault();
        this.executeDeleteAlbums();
      });
    }
    const btnConfirmExecuteDelete = document.getElementById('btn-confirm-execute-delete');
    if (btnConfirmExecuteDelete) {
      btnConfirmExecuteDelete.addEventListener('click', () => this.executeDeleteAlbums());
    }

    // ESCキーで全モーダル＆ドロップダウンを閉じる  
    window.addEventListener('keydown', (e) => {  
      if (e.key === 'Escape') {  
        this.closeItunesModal();  
        this.closeManualModal();  
        this.closeImageModal();  
        this.closeEditAlbumModal();  
        this.closeDriveArtworkModal();  
        this.closeDeleteConfirmModal();
        this.closeSearchDropdown('pc');  
        this.closeSearchDropdown('mobile');  
      }  
    });  
  }  

  /**  
   * 検索ドロップダウンを閉じる  
   * @param {'pc'|'mobile'} target   
   */  
  closeSearchDropdown(target = 'pc') {  
    const dropdown = document.getElementById(target === 'pc' ? 'pc-search-dropdown' : 'mobile-search-dropdown');  
    if (dropdown) dropdown.classList.add('hidden');  
    this.focusedSearchIndex = -1;  
  }  

  /**  
   * スプレッドシートからの全データ初期ロード  
   */  
  async loadInitialData() {  
    Utils.toggleGlobalLoading(true, 'スプレッドシートから楽曲カタログを取得中...');  
    try {  
      const data = await this.api.getAllData();  
      this.store.setTracks(data.tracks || []);  

      if (window.innerWidth >= 768 && this.store.state.artistList.length > 0) {  
        if (!this.store.state.selectedArtist) {  
          const firstArtist = this.store.state.artistList[0];  
          this.store.state.selectedArtist = firstArtist;  
          const albums = this.store.getAlbumsForSelectedArtist();  
          if (albums.length > 0) {  
            this.store.state.selectedAlbum = albums[0].albumName;  
          }  
        }  
      }  

      this.renderAll();  
      Utils.showToast(`${this.store.state.allTracks.length} 件の楽曲を読み込みました`, 'success');  
    } catch (err) {  
      console.error(err);  
      Utils.showToast(`データ取得失敗: ${err.message}`, 'error', 6000);  
    } finally {  
      Utils.toggleGlobalLoading(false);  
    }  
  }  

  /**  
   * 全ペインの再描画  
   */  
  renderAll() {  
    this.renderArtistList();  
    this.renderAlbumList();  
    this.renderTrackDetail();  
  }  

  /**  
   * STEP 1 アーティスト一覧の描画  
   */  
  renderArtistList() {  
    const container = document.getElementById('artist-list-container');  
    const badge = document.getElementById('artist-count-badge');  
    const emptyState = document.getElementById('artist-empty-state');  
    if (!container) return;  

    const filtered = this.store.getFilteredArtists();  
    if (badge) badge.textContent = `${filtered.length}件`;  

    if (filtered.length === 0) {  
      container.innerHTML = '';  
      if (emptyState) emptyState.classList.remove('hidden');  
      return;  
    }  
    if (emptyState) emptyState.classList.add('hidden');  

    const html = filtered.map((artist) => {  
      const artistData = this.store.state.musicCatalog[artist];  
      const albumCount = artistData ? artistData.albumCount : 0;  
      const isSelected = this.store.state.selectedArtist === artist;  
      const activeClass = isSelected  
        ? 'bg-indigo-600/20 border-l-4 border-indigo-500 text-indigo-200'  
        : 'hover:bg-slate-800/60 text-slate-300 border-l-4 border-transparent';  

      return `  
        <div class="artist-item px-3 py-2.5 flex items-center justify-between cursor-pointer transition select-none min-h-[44px] ${activeClass}"  
             data-artist="${Utils.escapeHtml(artist)}">  
          <div class="flex items-center gap-2 min-w-0">  
            <span class="text-xs md:text-sm font-medium truncate">${Utils.escapeHtml(artist)}</span>  
          </div>  
          <div class="flex items-center gap-1.5 flex-shrink-0">  
            <span class="text-[11px] px-1.5 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono">${albumCount}作</span>  
            <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">  
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>  
            </svg>  
          </div>  
        </div>  
      `;  
    }).join('');  

    container.innerHTML = html;  

    container.querySelectorAll('.artist-item').forEach((el) => {  
      el.addEventListener('click', () => {  
        const artist = el.getAttribute('data-artist');  
        this.selectArtist(artist);  
      });  
    });  
  }  

  /**  
   * アーティスト選択時  
   * @param {string} artist   
   */  
  selectArtist(artist) {  
    this.store.state.selectedArtist = artist;  
    const albums = this.store.getAlbumsForSelectedArtist();  
    this.store.state.selectedAlbum = albums.length > 0 ? albums[0].albumName : null;  

    // アーティスト変更時は選択モードおよび削除選択中キーをリセット
    this.store.state.selectedAlbumKeysForDeletion.clear();
    this.toggleAlbumSelectMode(false);

    this.renderArtistList();  
    this.renderAlbumList();  
    this.renderTrackDetail();  

    if (window.innerWidth < 768) {  
      this.setMobileStep(2);  
    }  
  }  

  /**  
   * STEP 2 アルバムカード一覧の描画  
   */  
  renderAlbumList() {  
    const container = document.getElementById('album-grid-container');  
    const headerName = document.getElementById('albums-header-artist-name');  
    const countBadge = document.getElementById('album-count-badge');  
    const emptyState = document.getElementById('album-empty-state');  
    const btnToggleSelect = document.getElementById('btn-toggle-album-select');
    if (!container) return;  

    const isSelectMode = Boolean(this.store.state.isAlbumSelectMode);

    const artist = this.store.state.selectedArtist;  
    if (!artist) {  
      if (headerName) headerName.textContent = '未選択';  
      if (countBadge) countBadge.textContent = '0作品';  
      if (btnToggleSelect) btnToggleSelect.classList.add('hidden');
      container.innerHTML = '';  
      if (emptyState) emptyState.classList.remove('hidden');  
      return;  
    }  

    const toolbar = document.getElementById('album-selection-toolbar');
    if (toolbar) {
      toolbar.classList.toggle('hidden', !isSelectMode);
    }

    if (btnToggleSelect) {
      btnToggleSelect.classList.remove('hidden');
      const btnText = document.getElementById('btn-toggle-album-select-text');
      if (btnText) {
        btnText.textContent = isSelectMode ? '完了' : '選択';
      }
      if (isSelectMode) {
        btnToggleSelect.classList.add('bg-indigo-600', 'text-white', 'border-indigo-500');
        btnToggleSelect.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
        btnToggleSelect.setAttribute('aria-pressed', 'true');
        btnToggleSelect.title = '選択モードを終了（完了）';
      } else {
        btnToggleSelect.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500');
        btnToggleSelect.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
        btnToggleSelect.setAttribute('aria-pressed', 'false');
        btnToggleSelect.title = '複数選択モードに切り替え';
      }
    }
    if (headerName) headerName.textContent = artist;  
    const albums = this.store.getAlbumsForSelectedArtist();  
    if (countBadge) countBadge.textContent = `${albums.length}作品`;  

    if (albums.length === 0) {  
      container.innerHTML = '';  
      if (emptyState) emptyState.classList.remove('hidden');  
      this.updateAlbumSelectionUI();
      return;  
    }  
    if (emptyState) emptyState.classList.add('hidden');  

    const html = albums.map((album) => {  
      const albumArtist = album.albumArtist || artist;
      const albumKey = `${String(albumArtist).trim()}:::${String(album.albumName || '').trim()}`;
      const isChecked = this.store.state.selectedAlbumKeysForDeletion.has(albumKey);

      let borderClass = 'border-slate-800 hover:border-slate-700';
      if (isSelectMode) {
        borderClass = isChecked 
          ? 'border-indigo-500 bg-indigo-950/20 ring-2 ring-indigo-500/50' 
          : 'border-slate-800 hover:border-slate-600 bg-slate-900/80';
      } else {
        const isSelected = this.store.state.selectedAlbum === album.albumName;  
        borderClass = isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/30' : 'border-slate-800 hover:border-slate-700';  
      }

      const rawArtwork = album.artworkUrl || '';  
      const resolvedArtwork = Utils.resolveArtworkUrl(rawArtwork, 400);  
      const artworkHtml = resolvedArtwork  
        ? '<img src="' + Utils.escapeHtml(resolvedArtwork) + '" alt="art" referrerpolicy="no-referrer" loading="lazy" class="w-full h-full object-cover transition duration-300 group-hover:scale-105" data-artwork="' + Utils.escapeHtml(rawArtwork) + '" data-error-step="0">'  
        : '<div class="w-full h-full flex items-center justify-center text-slate-700"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg></div>';  

      // 選択モード時のチェックボックスUI
      let checkboxHtml = '';
      if (isSelectMode) {
        checkboxHtml = `
          <div class="absolute top-2 left-2 z-10 w-6 h-6 rounded-md flex items-center justify-center transition shadow-md ${
            isChecked 
              ? 'bg-indigo-600 text-white ring-2 ring-white/30' 
              : 'bg-slate-900/80 border-2 border-slate-500 text-transparent hover:border-indigo-400'
          }">
            <svg class="w-4 h-4 ${isChecked ? 'block' : 'hidden'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
        `;
      }

      return `  
        <div class="album-card group cursor-pointer bg-slate-900 border ${borderClass} rounded-xl p-2.5 flex flex-col transition hover:bg-slate-800/80 active:scale-95 select-none relative"  
             data-album="${Utils.escapeHtml(album.albumName)}"
             data-artist="${Utils.escapeHtml(albumArtist)}"
             data-key="${Utils.escapeHtml(albumKey)}">  
          <div class="aspect-square w-full rounded-lg bg-slate-800 overflow-hidden mb-2 relative">  
            ${checkboxHtml}
            ${artworkHtml}  
            <div class="absolute bottom-1 right-1 px-1.5 py-0.5 bg-slate-950/80 backdrop-blur rounded text-[10px] font-mono text-slate-300">  
              ${album.totalTracks}曲  
            </div>  
          </div>  
          <h4 class="text-xs font-bold text-slate-200 line-clamp-2 leading-tight mb-1 group-hover:text-indigo-300 transition">  
            ${Utils.escapeHtml(album.albumName)}  
          </h4>  
          <span class="text-[11px] text-slate-500 font-mono">  
            ${album.releaseDate ? Utils.formatDate(album.releaseDate) : '日付なし'}  
          </span>  
        </div>  
      `;  
    }).join('');  

    container.innerHTML = html;  

    container.querySelectorAll('img[data-artwork]').forEach((img) => {  
      img.onerror = () => Utils.handleImageError(img);  
    });  

    container.querySelectorAll('.album-card').forEach((el) => {  
      el.addEventListener('click', () => {  
        const albumName = el.getAttribute('data-album');  
        const albumArtist = el.getAttribute('data-artist');
        if (this.store.state.isAlbumSelectMode) {
          // 選択モード中: カードクリックで選択トグル（STEP 3遷移を抑止）
          this.toggleAlbumSelection(albumArtist, albumName);
        } else {
          // 通常閲覧モード: アルバム詳細へドリルダウン
          this.selectAlbum(albumName);  
        }
      });  
    });  

    this.updateAlbumSelectionUI();
  }  

  /**  
   * アルバム選択時  
   * @param {string} albumName   
   */  
  selectAlbum(albumName) {  
    this.store.state.selectedAlbum = albumName;  
    this.renderAlbumList();  
    this.renderTrackDetail();  

    if (window.innerWidth < 768) {  
      this.setMobileStep(3);  
    }  
  }  

  /**  
   * STEP 3 トラック詳細・ディスク別一覧の描画  
   */  
  renderTrackDetail() {  
    const album = this.store.getSelectedAlbumData();  
    const discsContainer = document.getElementById('track-discs-container');  
    const emptyState = document.getElementById('track-empty-state');  
    const headerCard = document.getElementById('track-album-header');  
    if (!discsContainer) return;  

    if (!album) {  
      if (headerCard) headerCard.classList.add('hidden');  
      discsContainer.innerHTML = '';  
      if (emptyState) emptyState.classList.remove('hidden');  
      return;  
    }  

    if (emptyState) emptyState.classList.add('hidden');  
    if (headerCard) headerCard.classList.remove('hidden');  

    const bcArtist = document.getElementById('breadcrumb-artist');  
    const bcAlbum = document.getElementById('breadcrumb-album');  
    if (bcArtist) {  
      bcArtist.textContent = album.albumArtist;  
      bcArtist.onclick = () => {  
        if (window.innerWidth < 768) this.setMobileStep(1);  
      };  
    }  
    if (bcAlbum) bcAlbum.textContent = album.albumName;  

    const hArt = document.getElementById('track-header-artwork');  
    const hAlbum = document.getElementById('track-header-album-name');  
    const hArtist = document.getElementById('track-header-artist-name');  
    const hDate = document.getElementById('track-header-release-date');  
    const hTotal = document.getElementById('track-header-total-tracks');  

    if (hArt) {  
      const rawArt = album.artworkUrl || '';  
      const resolved = Utils.resolveArtworkUrl(rawArt, 800);  
      hArt.setAttribute('data-artwork', rawArt);  
      hArt.setAttribute('data-error-step', '0');  
      hArt.onerror = () => Utils.handleImageError(hArt, rawArt);  
      hArt.src = resolved || Utils.getDefaultArtworkSvg();  
    }  
    if (hAlbum) hAlbum.textContent = album.albumName;  
    if (hArtist) hArtist.textContent = album.albumArtist;  
    if (hDate) hDate.textContent = album.releaseDate ? `発売: ${Utils.formatDate(album.releaseDate)}` : '発売日未設定';  
    if (hTotal) hTotal.textContent = `全 ${album.totalTracks} 曲`;  

    const sortedDiscs = Object.values(album.discs).sort((a, b) => a.cdNumber - b.cdNumber);  

    const html = sortedDiscs.map((disc) => {  
      const rows = disc.tracks.map((t) => {  
        const artistDiffHtml = (t.trackArtist && t.trackArtist !== album.albumArtist)  
          ? '<p class="text-[11px] text-slate-400 truncate">' + Utils.escapeHtml(t.trackArtist) + '</p>'  
          : '';  

        return `  
        <div id="track-row-${disc.cdNumber}-${t.trackNumber}"  
             class="track-row-item px-3 py-2 flex items-center justify-between hover:bg-slate-800/50 transition duration-300 border-b border-slate-800/40 last:border-b-0 min-h-[44px]"  
             data-cd="${disc.cdNumber}" data-track-no="${t.trackNumber}">  
          <div class="flex items-center gap-3 min-w-0 pr-2">  
            <span class="w-6 text-center text-xs font-mono font-semibold text-slate-500 flex-shrink-0">  
              ${t.trackNumber}  
            </span>  
            <div class="min-w-0">  
              <p class="text-xs md:text-sm font-medium text-slate-200 truncate">  
                ${Utils.escapeHtml(t.trackName)}  
              </p>  
              ${artistDiffHtml}  
            </div>  
          </div>  
          <span class="text-[10px] text-slate-500 font-mono uppercase bg-slate-800/60 px-1.5 py-0.5 rounded flex-shrink-0">  
            Track ${t.trackNumber}  
          </span>  
        </div>  
      `;  
      }).join('');  

      return `  
        <div class="bg-slate-900 border border-slate-800/80 rounded-xl overflow-hidden shadow">  
          <div class="px-3 py-2 bg-slate-800/50 border-b border-slate-800 flex items-center justify-between">  
            <div class="flex items-center gap-2">  
              <span class="w-2 h-2 rounded-full bg-indigo-500"></span>  
              <h3 class="text-xs md:text-sm font-bold text-slate-200 font-mono">Disc ${disc.cdNumber}</h3>  
              <span class="text-[11px] text-slate-400 font-mono">(CD番号: ${disc.cdNumber})</span>  
            </div>  
            <span class="text-xs text-slate-400 font-mono">${disc.tracks.length} 曲</span>  
          </div>  
          <div class="divide-y divide-slate-800/40">  
            ${rows}  
          </div>  
        </div>  
      `;  
    }).join('');  

    discsContainer.innerHTML = html;  
  }  

  /**  
   * モバイルステップ切り替え  
   * @param {1|2|3} step   
   */  
  setMobileStep(step) {  
    this.store.state.mobileStep = step;  
    if (window.innerWidth >= 768) return;  

    const pArtists = document.getElementById('pane-artists');  
    const pAlbums = document.getElementById('pane-albums');  
    const pTracks = document.getElementById('pane-tracks');  

    if (pArtists) pArtists.classList.toggle('hidden', step !== 1);  
    if (pAlbums) pAlbums.classList.toggle('hidden', step !== 2);  
    if (pTracks) pTracks.classList.toggle('hidden', step !== 3);  
  }  

  /**  
   * リサイズ時のペイン表示制御  
   */  
  handleResize() {  
    const pArtists = document.getElementById('pane-artists');  
    const pAlbums = document.getElementById('pane-albums');  
    const pTracks = document.getElementById('pane-tracks');  

    if (window.innerWidth >= 768) {  
      if (pArtists) pArtists.classList.remove('hidden');  
      if (pAlbums) pAlbums.classList.remove('hidden');  
      if (pTracks) pTracks.classList.remove('hidden');  
    } else {  
      this.setMobileStep(this.store.state.mobileStep);  
    }  
  }  

  /**  
   * 全体クイック横断検索（カテゴリ別グルーピング・ハイライト・ドロップダウン表示）  
   * @param {string} query   
   * @param {'pc'|'mobile'} target   
   */  
  handleGlobalSearch(query, target = 'pc') {  
    this.currentSearchTarget = target;  
    const dropdown = document.getElementById(target === 'pc' ? 'pc-search-dropdown' : 'mobile-search-dropdown');  
    const resultsContainer = document.getElementById(target === 'pc' ? 'pc-search-results' : 'mobile-search-results');  

    if (!dropdown || !resultsContainer) return;  

    const trimmed = String(query || '').trim();  
    if (!trimmed) {  
      dropdown.classList.add('hidden');  
      resultsContainer.innerHTML = '';  
      this.focusedSearchIndex = -1;  
      return;  
    }  

    // 高速・曖昧・AND検索実行  
    const result = this.store.searchGrouped(trimmed);  
    const { artists, albums, tracks, totalCount, queryTokens } = result;  

    if (totalCount === 0) {  
      resultsContainer.innerHTML = `  
        <div class="p-6 text-center text-slate-500 text-xs">  
          <svg class="w-8 h-8 mx-auto mb-2 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">  
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>  
          </svg>  
          <span>「${Utils.escapeHtml(trimmed)}」に一致する結果は見つかりませんでした</span>  
        </div>  
      `;  
      dropdown.classList.remove('hidden');  
      this.focusedSearchIndex = -1;  
      return;  
    }  

    let html = '';  
    const defaultSvg = Utils.getDefaultArtworkSvg();  

    // 1. アーティスト セクション (最大3件)  
    if (artists.length > 0) {  
      html += `  
        <div class="px-2.5 py-1.5 text-[10px] font-bold uppercase tracking-wider text-indigo-400 bg-slate-950/60 sticky top-0 backdrop-blur z-10 flex items-center justify-between">  
          <span>アーティスト (${artists.length})</span>  
          <span class="text-[9px] text-slate-500 font-normal">アルバム一覧へ</span>  
        </div>  
      `;  
      artists.forEach((item) => {  
        const artUrl = item.artworkUrl ? Utils.resolveArtworkUrl(item.artworkUrl, 100) : defaultSvg;  
        const highlightedName = Utils.highlightMatch(item.artistName, queryTokens);  

        html += `  
          <div class="search-dropdown-item group p-2 hover:bg-indigo-600/20 cursor-pointer flex items-center justify-between gap-2.5 rounded-lg transition select-none"  
               data-type="artist" data-artist="${Utils.escapeHtml(item.artistName)}" role="option">  
            <div class="flex items-center gap-2.5 min-w-0">  
              <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700/80 overflow-hidden flex-shrink-0 flex items-center justify-center">  
                <img src="${Utils.escapeHtml(artUrl)}" data-artwork="${Utils.escapeHtml(item.artworkUrl || '')}" data-error-step="0" class="w-full h-full object-cover" loading="lazy">  
              </div>  
              <div class="min-w-0">  
                <h5 class="text-xs font-bold text-slate-100 truncate group-hover:text-indigo-300 transition">${highlightedName}</h5>  
                <p class="text-[10px] text-slate-400 font-mono">${item.albumCount} 作品を保有</p>  
              </div>  
            </div>  
            <span class="text-[10px] text-slate-500 font-mono bg-slate-800/80 px-1.5 py-0.5 rounded flex-shrink-0">Artist</span>  
          </div>  
        `;  
      });  
    }  

    // 2. アルバム セクション (最大5件)  
    if (albums.length > 0) {  
      html += `  
        <div class="px-2.5 py-1.5 text-[10px] font-bold uppercase tracking-wider text-indigo-400 bg-slate-950/60 sticky top-0 backdrop-blur z-10 flex items-center justify-between mt-1">  
          <span>アルバム (${albums.length})</span>  
          <span class="text-[9px] text-slate-500 font-normal">収録曲一覧へ</span>  
        </div>  
      `;  
      albums.forEach((item) => {  
        const artUrl = item.artworkUrl ? Utils.resolveArtworkUrl(item.artworkUrl, 120) : defaultSvg;  
        const highlightedAlbum = Utils.highlightMatch(item.albumName, queryTokens);  
        const highlightedArtist = Utils.highlightMatch(item.albumArtist, queryTokens);  

        html += `  
          <div class="search-dropdown-item group p-2 hover:bg-indigo-600/20 cursor-pointer flex items-center justify-between gap-2.5 rounded-lg transition select-none"  
               data-type="album" data-artist="${Utils.escapeHtml(item.albumArtist)}" data-album="${Utils.escapeHtml(item.albumName)}" role="option">  
            <div class="flex items-center gap-2.5 min-w-0">  
              <img src="${Utils.escapeHtml(artUrl)}" data-artwork="${Utils.escapeHtml(item.artworkUrl || '')}" data-error-step="0" class="w-9 h-9 rounded-lg object-cover bg-slate-800 border border-slate-700/80 flex-shrink-0 shadow" loading="lazy">  
              <div class="min-w-0">  
                <h5 class="text-xs font-bold text-slate-100 truncate group-hover:text-indigo-300 transition">${highlightedAlbum}</h5>  
                <p class="text-[10px] text-slate-400 truncate mt-0.5">${highlightedArtist} • ${item.totalTracks}曲</p>  
              </div>  
            </div>  
            <span class="text-[10px] text-slate-500 font-mono bg-slate-800/80 px-1.5 py-0.5 rounded flex-shrink-0">Album</span>  
          </div>  
        `;  
      });  
    }  

    // 3. トラック セクション (最大10件)  
    if (tracks.length > 0) {  
      html += `  
        <div class="px-2.5 py-1.5 text-[10px] font-bold uppercase tracking-wider text-indigo-400 bg-slate-950/60 sticky top-0 backdrop-blur z-10 flex items-center justify-between mt-1">  
          <span>楽曲 (${tracks.length})</span>  
          <span class="text-[9px] text-slate-500 font-normal">該当曲へジャンプ</span>  
        </div>  
      `;  
      tracks.forEach((item) => {  
        const artUrl = item.artworkUrl ? Utils.resolveArtworkUrl(item.artworkUrl, 100) : defaultSvg;  
        const highlightedTrack = Utils.highlightMatch(item.trackName, queryTokens);  
        const highlightedMeta = Utils.highlightMatch(`${item.trackArtist || item.albumArtist} • ${item.albumName}`, queryTokens);  

        html += `  
          <div class="search-dropdown-item group p-2 hover:bg-indigo-600/20 cursor-pointer flex items-center justify-between gap-2.5 rounded-lg transition select-none"  
               data-type="track"  
               data-artist="${Utils.escapeHtml(item.albumArtist)}"  
               data-album="${Utils.escapeHtml(item.albumName)}"  
               data-cd="${item.cdNumber}"  
               data-track-no="${item.trackNumber}" role="option">  
            <div class="flex items-center gap-2.5 min-w-0">  
              <img src="${Utils.escapeHtml(artUrl)}" data-artwork="${Utils.escapeHtml(item.artworkUrl || '')}" data-error-step="0" class="w-8 h-8 rounded object-cover bg-slate-800 border border-slate-700/60 flex-shrink-0" loading="lazy">  
              <div class="min-w-0">  
                <h5 class="text-xs font-semibold text-slate-100 truncate group-hover:text-indigo-200 transition">${highlightedTrack}</h5>  
                <p class="text-[10px] text-slate-400 truncate mt-0.5">${highlightedMeta}</p>  
              </div>  
            </div>  
            <div class="text-right flex-shrink-0">  
              <span class="text-[10px] font-mono text-indigo-400 font-bold">Disc ${item.cdNumber}</span>  
              <span class="text-[10px] font-mono text-slate-500 ml-1">#${item.trackNumber}</span>  
            </div>  
          </div>  
        `;  
      });  
    }  

    // 合計件数フッター  
    const displayedSum = artists.length + albums.length + tracks.length;  
    if (totalCount > displayedSum) {  
      html += `  
        <div class="p-2 text-center text-[10px] text-slate-500 bg-slate-950/80 border-t border-slate-800 font-mono">  
          他 ${totalCount - displayedSum} 件の一致... (キーワードを追加して絞り込んでください)  
        </div>  
      `;  
    }  

    resultsContainer.innerHTML = html;  
    dropdown.classList.remove('hidden');  
    this.focusedSearchIndex = -1;  

    // 画像読み込みエラーハンドリング  
    resultsContainer.querySelectorAll('img[data-artwork]').forEach((img) => {  
      img.onerror = () => Utils.handleImageError(img);  
    });  

    // 各候補クリックイベントのバインド  
    resultsContainer.querySelectorAll('.search-dropdown-item').forEach((itemEl) => {  
      itemEl.addEventListener('click', () => {  
        this.selectSearchResultItem(itemEl, target);  
      });  
    });  
  }  

  /**  
   * 検索結果アイテムの選択実行  
   * @param {HTMLElement} itemEl   
   * @param {'pc'|'mobile'} target   
   */  
  selectSearchResultItem(itemEl, target = 'pc') {  
    const type = itemEl.getAttribute('data-type');  
    const artist = itemEl.getAttribute('data-artist');  
    const album = itemEl.getAttribute('data-album');  
    const cd = itemEl.getAttribute('data-cd');  
    const trackNo = itemEl.getAttribute('data-track-no');  

    this.closeSearchDropdown(target);  

    // クイック検索経由の画面遷移時はアルバム選択モードおよび選択キーSetを確実に初期化 (BUG-001)
    this.store.state.isAlbumSelectMode = false;
    this.store.state.selectedAlbumKeysForDeletion.clear();
    this.toggleAlbumSelectMode(false);

    if (type === 'artist') {  
      this.selectArtist(artist);  
      Utils.showToast(`アーティスト「${artist}」を選択しました`, 'info');  
    } else if (type === 'album') {  
      this.store.state.selectedArtist = artist;  
      this.selectAlbum(album);  
      Utils.showToast(`アルバム「${album}」を開きました`, 'info');  
    } else if (type === 'track') {  
      this.selectTrackFromSearch(artist, album, cd, trackNo);  
    }  
  }  

  /**  
   * 検索結果の楽曲選択時（アルバム展開・該当年スクロール・発光ハイライト）  
   * @param {string} artist   
   * @param {string} album   
   * @param {string|number} cd   
   * @param {string|number} trackNo   
   */  
  selectTrackFromSearch(artist, album, cd, trackNo) {  
    this.store.state.selectedArtist = artist;  
    this.store.state.selectedAlbum = album;  

    this.renderAll();  

    if (window.innerWidth < 768) {  
      this.setMobileStep(3);  
    }  

    // DOMレンダリング後に該当トラック行へスクロール＆ハイライト  
    setTimeout(() => {  
      const rowId = `track-row-${cd}-${trackNo}`;  
      const rowEl = document.getElementById(rowId);  
      if (rowEl) {  
        rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });  
        // 一時的にパルス強調  
        rowEl.classList.add('bg-indigo-600/30', 'ring-2', 'ring-indigo-500/80');  
        setTimeout(() => {  
          rowEl.classList.remove('bg-indigo-600/30', 'ring-2', 'ring-indigo-500/80');  
        }, 2500);  
      }  
    }, 120);  
  }  

  /**  
   * 検索バーのキーボード操作（IME変換保護・↑↓選択・Enter確定・Esc閉じる）  
   * @param {KeyboardEvent} e   
   * @param {'pc'|'mobile'} target   
   */  
  handleSearchKeydown(e, target = 'pc') {  
    // 日本語IME変換確定（Enter等）は無視  
    if (e.isComposing || e.keyCode === 229) {  
      return;  
    }  

    const dropdown = document.getElementById(target === 'pc' ? 'pc-search-dropdown' : 'mobile-search-dropdown');  
    if (!dropdown || dropdown.classList.contains('hidden')) {  
      return;  
    }  

    const items = dropdown.querySelectorAll('.search-dropdown-item');  
    if (items.length === 0) return;  

    if (e.key === 'ArrowDown') {  
      e.preventDefault();  
      this.navigateSearchItems(items, 1);  
    } else if (e.key === 'ArrowUp') {  
      e.preventDefault();  
      this.navigateSearchItems(items, -1);  
    } else if (e.key === 'Enter') {  
      if (this.focusedSearchIndex >= 0 && this.focusedSearchIndex < items.length) {  
        e.preventDefault();  
        items[this.focusedSearchIndex].click();  
      }  
    } else if (e.key === 'Escape') {  
      e.preventDefault();  
      this.closeSearchDropdown(target);  
    }  
  }  

  /**  
   * キーボード矢印キーによるフォーカス循環  
   * @param {NodeList} items   
   * @param {number} direction   
   */  
  navigateSearchItems(items, direction) {  
    if (items.length === 0) return;  

    // 旧フォーカス解除  
    if (this.focusedSearchIndex >= 0 && this.focusedSearchIndex < items.length) {  
      items[this.focusedSearchIndex].classList.remove('bg-indigo-600/30', 'ring-1', 'ring-indigo-400');  
    }  

    this.focusedSearchIndex += direction;  
    if (this.focusedSearchIndex >= items.length) this.focusedSearchIndex = 0;  
    if (this.focusedSearchIndex < 0) this.focusedSearchIndex = items.length - 1;  

    const activeItem = items[this.focusedSearchIndex];  
    activeItem.classList.add('bg-indigo-600/30', 'ring-1', 'ring-indigo-400');  
    activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });  
  }  

  /**  
   * iTunes モーダル表示  
   */  
  openItunesModal() {  
    const modal = document.getElementById('modal-itunes');  
    if (modal) modal.classList.remove('hidden');  
    const input = document.getElementById('itunes-search-input');  
    if (input) {

      input.focus();  
    }  
  }  

  closeItunesModal() {  
    const modal = document.getElementById('modal-itunes');  
    if (modal) modal.classList.add('hidden');  
  }  

  /**  
   * アルバム検索実行（iTunes + MusicBrainz 統合検索）  
   */  
  async executeItunesSearch() {  
    const input = document.getElementById('itunes-search-input');  
    const keyword = input ? input.value.trim() : '';  
    if (!keyword) {  
      Utils.showToast('検索キーワードを入力してください', 'warning');  
      return;  
    }  

    const searchBtn = document.getElementById('btn-itunes-search-submit');  
    const btnText = document.getElementById('itunes-search-btn-text');  
    const spinner = document.getElementById('itunes-search-spinner');  
    if (searchBtn) searchBtn.disabled = true;  
    if (btnText) btnText.classList.add('hidden');  
    if (spinner) spinner.classList.remove('hidden');  

    try {  
      const res = (typeof this.api.searchAlbums === 'function')  
        ? await this.api.searchAlbums(keyword)  
        : await this.api.searchItunes(keyword);  
      this.store.state.itunesSearchResults = (res && Array.isArray(res.albums)) ? res.albums : [];  
      this.store.state.searchSources = (res && res.sources) ? res.sources : null;  
      this.renderItunesResults();  

      if (res && res.sources) {  
        const itStatus = res.sources.itunes;  
        const mbStatus = res.sources.musicbrainz;  
        if (mbStatus && mbStatus.ok === false && !mbStatus.skipped) {  
          Utils.showToast('MusicBrainz の検索に失敗したため iTunes の結果のみ表示しています', 'warning', 4500);  
        } else if (itStatus && itStatus.ok === false) {  
          Utils.showToast('iTunes の検索に失敗したため MusicBrainz の結果のみ表示しています', 'warning', 4500);  
        }  
      }  
    } catch (err) {  
      Utils.showToast(`アルバム検索エラー: ${err.message}`, 'error');  
    } finally {  
      if (searchBtn) searchBtn.disabled = false;  
      if (btnText) btnText.classList.remove('hidden');  
      if (spinner) spinner.classList.add('hidden');  
    }  
  }  

  /**  
   * アルバム検索結果描画  
   */  
  renderItunesResults() {  
    const container = document.getElementById('itunes-results-container');  
    if (!container) return;  

    const list = this.store.state.itunesSearchResults;  
    if (!Array.isArray(list) || list.length === 0) {  
      container.innerHTML = '<div class="p-8 text-center text-slate-500 text-xs">該当するアルバムが見つかりませんでした</div>';  
      return;  
    }  

    const defaultSvg = (typeof Utils.getDefaultArtworkSvg === 'function') ? Utils.getDefaultArtworkSvg() : '';  

    const html = list.map((item) => {  
      const source = item.source === 'musicbrainz' ? 'musicbrainz' : 'itunes';  
      const sourceId = String(item.sourceId !== undefined && item.sourceId !== null ? item.sourceId : (item.collectionId || ''));  
      const isMb = source === 'musicbrainz';  
      const badgeHtml = isMb  
        ? '<span class="px-1.5 py-0.5 text-[9px] font-semibold rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 flex-shrink-0">MusicBrainz</span>'  
        : '<span class="px-1.5 py-0.5 text-[9px] font-semibold rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 flex-shrink-0">iTunes</span>';  

      const rawArt = item.artworkUrl100 || '';  
      const imgSrc = rawArt ? Utils.escapeHtml(rawArt) : Utils.escapeHtml(defaultSvg);  
      const yearStr = item.releaseDate ? Utils.escapeHtml(String(item.releaseDate).substring(0, 10)) : '';  
      const trackCountNum = Number(item.trackCount) || 0;  

      const metaParts = [];  
      if (yearStr) metaParts.push(`<span>${yearStr}</span>`);  
      if (trackCountNum > 0) metaParts.push(`<span>${trackCountNum}曲</span>`);  

      if (isMb && item.extra && typeof item.extra === 'object') {  
        if (item.extra.format) {  
          metaParts.push(`<span class="text-slate-400">${Utils.escapeHtml(String(item.extra.format))}</span>`);  
        }  
        if (item.extra.country) {  
          metaParts.push(`<span>[${Utils.escapeHtml(String(item.extra.country))}]</span>`);  
        }  
        if (Number(item.extra.discCount) > 1) {  
          metaParts.push(`<span>${Number(item.extra.discCount)}枚組</span>`);  
        }  
        if (item.extra.label) {  
          metaParts.push(`<span class="truncate max-w-[120px]">${Utils.escapeHtml(String(item.extra.label))}</span>`);  
        }  
      } else if (item.primaryGenreName) {  
        metaParts.push(`<span>${Utils.escapeHtml(String(item.primaryGenreName))}</span>`);  
      }  

      const disambigHtml = (isMb && item.extra && item.extra.disambiguation)  
        ? `<p class="text-[10px] text-amber-400/80 truncate mt-0.5">${Utils.escapeHtml(String(item.extra.disambiguation))}</p>`  
        : '';  

      return `  
        <div class="itunes-result-item p-2.5 hover:bg-slate-800/60 cursor-pointer flex gap-2.5 items-center transition"  
             data-source="${Utils.escapeHtml(source)}"  
             data-id="${Utils.escapeHtml(sourceId)}">  
          <img src="${imgSrc}" data-artwork="${Utils.escapeHtml(rawArt)}" data-error-step="0" class="w-12 h-12 rounded object-cover bg-slate-800 flex-shrink-0" loading="lazy">  
          <div class="min-w-0 flex-1">  
            <div class="flex items-center gap-1.5">  
              ${badgeHtml}  
              <h5 class="text-xs font-bold text-slate-200 truncate">${Utils.escapeHtml(item.albumName)}</h5>  
            </div>  
            <p class="text-[11px] text-slate-400 truncate mt-0.5">${Utils.escapeHtml(item.albumArtist)}</p>  
            ${disambigHtml}  
            <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[10px] text-slate-500 font-mono mt-0.5">  
              ${metaParts.join('')}  
            </div>  
          </div>  
        </div>  
      `;  
    }).join('');  

    container.innerHTML = html;  

    container.querySelectorAll('img[data-artwork]').forEach((img) => {  
      img.onerror = () => Utils.handleImageError(img);  
    });  

    container.querySelectorAll('.itunes-result-item').forEach((el) => {  
      el.addEventListener('click', () => {  
        const id = el.getAttribute('data-id');  
        const source = el.getAttribute('data-source') || 'itunes';  
        this.selectItunesAlbumForPreview(id, source);  
      });  
    });  
  }  

  /**  
   * アルバム選択・収録曲Lookupプレビュー  
   */  
  async selectItunesAlbumForPreview(collectionId, source = 'itunes') {  
    const empty = document.getElementById('itunes-preview-empty');  
    const content = document.getElementById('itunes-preview-content');  
    const submitBtn = document.getElementById('btn-submit-itunes-batch');  
    const isMb = source === 'musicbrainz';  

    const loadingMsg = isMb  
      ? 'MusicBrainz から収録曲とディスク情報を取得中...'  
      : 'iTunes から収録曲とディスク情報を取得中...';  

    Utils.toggleGlobalLoading(true, loadingMsg);  
    try {  
      const res = isMb  
        ? await this.api.lookupMusicBrainzRelease(collectionId)  
        : await this.api.lookupItunesAlbum(collectionId);  
      const detail = res.albumDetail;  
      this.store.state.selectedItunesAlbum = detail;  

      if (empty) empty.classList.add('hidden');  
      if (content) content.classList.remove('hidden');  

      const art = document.getElementById('itunes-preview-artwork');  
      const alb = document.getElementById('itunes-preview-album');  
      const artName = document.getElementById('itunes-preview-artist');  
      const meta = document.getElementById('itunes-preview-meta');  
      const tbody = document.getElementById('itunes-preview-tracks-tbody');  
      const summary = document.getElementById('itunes-selected-summary');  

      if (art) {  
        const rawArt = detail.artworkUrl100 || '';  
        art.setAttribute('data-artwork', rawArt);  
        art.setAttribute('data-error-step', '0');  
        art.onerror = () => Utils.handleImageError(art);  
        art.src = rawArt || ((typeof Utils.getDefaultArtworkSvg === 'function') ? Utils.getDefaultArtworkSvg() : '');  
      }  
      if (alb) alb.textContent = detail.albumName;  
      if (artName) artName.textContent = detail.albumArtist;  
      const sourceLabel = isMb ? 'MusicBrainz' : 'iTunes';  
      if (meta) meta.textContent = `[${sourceLabel}] ${detail.releaseDate || 'リリース日不明'} • 全 ${detail.tracks.length} 曲`;  
      if (summary) summary.textContent = `選択中: ${detail.albumName} (${detail.tracks.length} 曲)`;  

      if (tbody) {  
        tbody.innerHTML = detail.tracks.map((t) => {  
          const cdLabel = t.mediumFormat  
            ? `${t.cdNumber} <span class="text-[9px] text-slate-400 font-normal">(${Utils.escapeHtml(String(t.mediumFormat))})</span>`  
            : `${t.cdNumber}`;  
          return `  
            <tr class="hover:bg-slate-800/40">  
              <td class="py-1 px-1.5 text-center font-mono text-indigo-400 font-bold whitespace-nowrap">${cdLabel}</td>  
              <td class="py-1 px-1.5 text-center font-mono text-slate-500">${t.trackNumber}</td>  
              <td class="py-1 px-2 font-medium text-slate-200 truncate max-w-[150px]">${Utils.escapeHtml(t.trackName)}</td>  
              <td class="py-1 px-2 text-slate-400 truncate max-w-[100px]">${Utils.escapeHtml(t.trackArtist)}</td>  
            </tr>  
          `;  
        }).join('');  
      }  

      if (detail.truncated) {  
        Utils.showToast('収録曲数が非常に多いため、一部のトラックが省略されている可能性があります', 'warning', 5000);  
      }  

      if (submitBtn) submitBtn.disabled = false;  
    } catch (err) {  
      Utils.showToast(`プレビュー取得失敗: ${err.message}`, 'error');  
    } finally {  
      Utils.toggleGlobalLoading(false);  
    }  
  }  

  /**  
   * iTunes アルバム一括保存実行  
   */  
  async submitItunesBatch() {  
    const detail = this.store.state.selectedItunesAlbum;  
    if (!detail) return;  

    if (this.store.state.isSaving) return;  
    this.store.state.isSaving = true;  

    const btnText = document.getElementById('itunes-batch-btn-text');  
    const spinner = document.getElementById('itunes-batch-spinner');  
    const submitBtn = document.getElementById('btn-submit-itunes-batch');  

    if (btnText) btnText.classList.add('hidden');  
    if (spinner) spinner.classList.remove('hidden');  
    if (submitBtn) submitBtn.disabled = true;  

    Utils.toggleGlobalLoading(true, 'Google Driveへジャケット保存およびスプレッドシートへ一括書き込み中...');  

    try {  
      const payload = {  
        albumName: detail.albumName,  
        albumArtist: detail.albumArtist,  
        releaseDate: detail.releaseDate,  
        artworkUrl500: detail.artworkUrl500,  
        tracks: detail.tracks  
      };  

      const res = await this.api.saveAlbumBatch(payload);  
      Utils.showToast(`「${detail.albumName}」(${res.count}曲) を一括登録しました！`, 'success', 4000);  

      this.closeItunesModal();  
      await this.loadInitialData();  

      this.store.state.selectedArtist = detail.albumArtist;  
      this.store.state.selectedAlbum = detail.albumName;  
      this.renderAll();  
      if (window.innerWidth < 768) this.setMobileStep(3);  

    } catch (err) {  
      Utils.showToast(`登録エラー: ${err.message}`, 'error', 6000);  
    } finally {  
      this.store.state.isSaving = false;  
      Utils.toggleGlobalLoading(false);  
      if (btnText) btnText.classList.remove('hidden');  
      if (spinner) spinner.classList.add('hidden');  
      if (submitBtn) submitBtn.disabled = false;  
    }  
  }  

  /**  
   * 手動登録モーダル表示  
   */  
  openManualModal(preset = {}) {  
    this.hasManualSaved = false;  
    this.lastManualAlbumArtist = null;  
    this.lastManualAlbumName = null;  

    const modal = document.getElementById('modal-manual');  
    if (modal) modal.classList.remove('hidden');  

    const artistInput = document.getElementById('manual-album-artist');  
    const albumInput = document.getElementById('manual-album-name');  
    const cdInput = document.getElementById('manual-cd-number');  
    const trackNoInput = document.getElementById('manual-track-number');  
    const trackNameInput = document.getElementById('manual-track-name');  
    const trackArtistInput = document.getElementById('manual-track-artist');  
    const dateInput = document.getElementById('manual-release-date');  
    const artInput = document.getElementById('manual-artwork-url');  

    if (artistInput) artistInput.value = preset.albumArtist || this.store.state.selectedArtist || '';  
    if (albumInput) albumInput.value = preset.albumName || this.store.state.selectedAlbum || '';  
    if (cdInput) cdInput.value = preset.cdNumber || 1;  
    if (trackNoInput) trackNoInput.value = preset.trackNumber || 1;  
    if (trackNameInput) trackNameInput.value = '';  
    if (trackArtistInput) trackArtistInput.value = preset.albumArtist || this.store.state.selectedArtist || '';  
    if (dateInput) dateInput.value = preset.releaseDate || '';  
    if (artInput) artInput.value = preset.artworkUrl || '';  

    const artPreview = document.getElementById('manual-art-preview');  
    if (artPreview) {  
      artPreview.onerror = () => {  
        artPreview.src = Utils.getDefaultArtworkSvg();  
      };  
      const resolved = preset.artworkUrl ? Utils.resolveArtworkUrl(preset.artworkUrl, 200) : '';  
      artPreview.src = resolved || Utils.getDefaultArtworkSvg();  
    }  

    if (trackNameInput) trackNameInput.focus();  
  }  

  async closeManualModal(force = false) {  
    if (this.store.state.isSaving && !force) return;  

    const modal = document.getElementById('modal-manual');  
    if (modal) modal.classList.add('hidden');  

    if (this.hasManualSaved) {  
      const targetArtist = this.lastManualAlbumArtist;  
      const targetAlbum = this.lastManualAlbumName;  
      this.hasManualSaved = false;  
      this.lastManualAlbumArtist = null;  
      this.lastManualAlbumName = null;  

      try {  
        if (targetArtist) this.store.state.selectedArtist = targetArtist;  
        if (targetAlbum) this.store.state.selectedAlbum = targetAlbum;  
        await this.loadInitialData();  
        if (window.innerWidth < 768) this.setMobileStep(3);  
      } catch (err) {  
        console.error('手動登録後のデータ再取得エラー:', err);  
      }  
    }  
  }  

  /**  
   * 手動楽曲登録送信  
   */  
  async submitManualTrack() {  
    const form = document.getElementById('form-manual-track');  
    if (form && !form.checkValidity()) {  
      form.reportValidity();  
      return;  
    }  

    if (this.store.state.isSaving) return;  
    this.store.state.isSaving = true;  

    const btnText = document.getElementById('manual-submit-btn-text');  
    const spinner = document.getElementById('manual-submit-spinner');  
    const btnSubmitManual = document.getElementById('btn-submit-manual-track');  
    const btnCloseManual = document.getElementById('btn-close-manual-modal');  
    const btnCancelManual = document.getElementById('btn-cancel-manual-modal');  

    if (btnText) btnText.classList.add('hidden');  
    if (spinner) spinner.classList.remove('hidden');  
    if (btnSubmitManual) btnSubmitManual.disabled = true;  
    if (btnCloseManual) btnCloseManual.disabled = true;  
    if (btnCancelManual) btnCancelManual.disabled = true;  

    const cdNumber = Number(document.getElementById('manual-cd-number').value) || 1;  
    const albumArtist = document.getElementById('manual-album-artist').value.trim();  
    const albumName = document.getElementById('manual-album-name').value.trim();  
    const trackArtist = (document.getElementById('manual-track-artist').value || albumArtist).trim();  
    const trackNumber = Number(document.getElementById('manual-track-number').value) || 1;  
    const trackName = document.getElementById('manual-track-name').value.trim();  
    const releaseDate = document.getElementById('manual-release-date').value.trim();  
    const artworkUrl = document.getElementById('manual-artwork-url').value.trim();  
    const continuous = document.getElementById('manual-continuous-check').checked;  

    try {  
      const payload = {  
        cdNumber,  
        albumArtist,  
        albumName,  
        trackArtist,  
        trackNumber,  
        trackName,  
        releaseDate,  
        artworkUrl  
      };  

      await this.api.saveTrackSingle(payload);  
      Utils.showToast(`Track ${trackNumber}: ${trackName} を登録しました`, 'success');  

      this.hasManualSaved = true;  
      this.lastManualAlbumArtist = albumArtist;  
      this.lastManualAlbumName = albumName;  

      if (continuous) {  
        const trackNoEl = document.getElementById('manual-track-number');  
        const trackNameEl = document.getElementById('manual-track-name');  
        if (trackNoEl) trackNoEl.value = trackNumber + 1;  
        if (trackNameEl) {  
          trackNameEl.value = '';  
          trackNameEl.focus();  
        }  
      } else {  
        await this.closeManualModal(true);  
      }  
    } catch (err) {  
      Utils.showToast(`手動登録エラー: ${err.message}`, 'error');  
    } finally {  
      this.store.state.isSaving = false;  
      if (btnText) btnText.classList.remove('hidden');  
      if (spinner) spinner.classList.add('hidden');  
      if (btnSubmitManual) btnSubmitManual.disabled = false;  
      if (btnCloseManual) btnCloseManual.disabled = false;  
      if (btnCancelManual) btnCancelManual.disabled = false;  
    }  
  }  

  /**  
   * アルバムアート拡大表示  
   */  
  openImageModal(url, title) {  
    const modal = document.getElementById('modal-image');  
    const img = document.getElementById('image-modal-img');  
    const titleEl = document.getElementById('image-modal-title');  
    if (!modal || !img) return;  

    const rawUrl = url || '';  
    const resolved = Utils.resolveArtworkUrl(rawUrl, 1200);  
    img.setAttribute('data-artwork', rawUrl);  
    img.setAttribute('data-error-step', '0');  
    img.onerror = () => Utils.handleImageError(img, rawUrl);  
    img.src = resolved;  
    if (titleEl) titleEl.textContent = title;  
    modal.classList.remove('hidden');  
  }  

  closeImageModal() {  
    const modal = document.getElementById('modal-image');  
    if (modal) modal.classList.add('hidden');  
  }  

  /**  
   * アルバム編集モーダル表示  
   */  
  openEditAlbumModal(albumData) {  
    const album = albumData || this.store.getSelectedAlbumData();  
    if (!album) {  
      Utils.showToast('編集対象のアルバムが見つかりません', 'warning');  
      return;  
    }  

    this.editingTargetKey = {  
      originalAlbumArtist: album.albumArtist,  
      originalAlbumName: album.albumName  
    };  
    this.editingOriginalReleaseDate = album.releaseDate ? String(album.releaseDate).trim() : '';  
    this.editingReleaseDateChanged = false;  

    const nameInput = document.getElementById('edit-album-name');  
    const artistInput = document.getElementById('edit-album-artist');  
    const dateInput = document.getElementById('edit-album-release-date');  
    const artUrlInput = document.getElementById('edit-album-artwork-url');  
    const artPreview = document.getElementById('edit-album-art-preview');  

    if (nameInput) nameInput.value = album.albumName || '';  
    if (artistInput) artistInput.value = album.albumArtist || '';  
    if (dateInput) {  
      const formattedDate = album.releaseDate ? Utils.formatDate(album.releaseDate) : '';  
      dateInput.value = /^\d{4}-\d{2}-\d{2}$/.test(formattedDate) ? formattedDate : '';  
    }  
    if (artUrlInput) artUrlInput.value = album.artworkUrl || '';  
    if (artPreview) {  
      artPreview.onerror = () => {  
        artPreview.src = Utils.getDefaultArtworkSvg();  
      };  
      artPreview.src = album.artworkUrl ? Utils.resolveArtworkUrl(album.artworkUrl, 400) : Utils.getDefaultArtworkSvg();  
    }  

    this.editingTracks = [];  
    const sortedDiscs = Object.values(album.discs || {}).sort((a, b) => a.cdNumber - b.cdNumber);  
    sortedDiscs.forEach((disc) => {  
      disc.tracks.forEach((t) => {  
        this.editingTracks.push({  
          cdNumber: Number(t.cdNumber) || Number(disc.cdNumber) || 1,  
          trackNumber: Number(t.trackNumber) || 1,  
          trackName: t.trackName || '',  
          trackArtist: t.trackArtist || album.albumArtist || ''  
        });  
      });  
    });  

    if (this.editingTracks.length === 0) {  
      this.editingTracks.push({  
        cdNumber: 1,  
        trackNumber: 1,  
        trackName: '',  
        trackArtist: album.albumArtist || ''  
      });  
    }  

    this.renderEditModalTracks();  

    const modal = document.getElementById('modal-edit-album');  
    if (modal) modal.classList.remove('hidden');  

    if (nameInput) nameInput.focus();  
  }  

  closeEditAlbumModal() {  
    const modal = document.getElementById('modal-edit-album');  
    if (modal) modal.classList.add('hidden');  
    this.editingTargetKey = null;  
    this.editingTracks = [];  
    this.editingOriginalReleaseDate = '';  
    this.editingReleaseDateChanged = false;  
  }  

  /**  
   * ローカル画像ファイルの選択・検証・即時プレビューおよびアップロード  
   * @param {Event} event   
   * @param {'editAlbum'|'manual'} context   
   */  
  async handleImageUpload(event, context) {  
    const file = event.target && event.target.files && event.target.files[0];  
    if (!file) return;  

    const validation = Utils.validateImageFile(file);  
    if (!validation.valid) {  
      Utils.showToast(validation.error || '画像ファイルが不正です', 'error');  
      event.target.value = '';  
      return;  
    }  

    const isEdit = context === 'editAlbum';  
    const previewEl = document.getElementById(isEdit ? 'edit-album-art-preview' : 'manual-art-preview');  
    const urlInputEl = document.getElementById(isEdit ? 'edit-album-artwork-url' : 'manual-artwork-url');  
    const albumNameEl = document.getElementById(isEdit ? 'edit-album-name' : 'manual-album-name');  
    const uploadBtn = document.getElementById(isEdit ? 'btn-edit-album-upload' : 'btn-manual-upload');  
    const spinner = uploadBtn ? uploadBtn.querySelector(isEdit ? '.edit-album-upload-spinner' : '.manual-upload-spinner') : null;  

    let base64Data = '';  
    let uploadMimeType = validation.mimeType;  
    try {  
      if (typeof Utils.resizeImage === 'function') {  
        base64Data = await Utils.resizeImage(file, { maxWidth: 800, maxHeight: 800, quality: 0.85 });  
        const headerMatch = base64Data.match(/^data:([^;]+);base64,/i);
        uploadMimeType = headerMatch ? headerMatch[1].toLowerCase() : 'image/jpeg';  
      } else {  
        base64Data = await Utils.readFileAsBase64(file);  
      }  
      if (previewEl) {  
        previewEl.onerror = () => {  
          previewEl.src = Utils.getDefaultArtworkSvg();  
        };  
        previewEl.src = base64Data;  
      }  
    } catch (readErr) {  
      Utils.showToast('画像読み込み失敗: ' + readErr.message, 'error');  
      event.target.value = '';  
      return;  
    }  

    // 親フォーム「保存」「登録」ボタンおよびDrive追加ボタンの競合防止制御 (BUG-002)
    const relatedBtnIds = [
      'btn-submit-edit-album',
      'btn-mobile-submit-edit-album',
      'btn-submit-manual-track',
      'btn-edit-album-drive',
      'btn-manual-drive'
    ];
    const relatedBtns = relatedBtnIds
      .map(id => document.getElementById(id))
      .filter(el => el !== null);

    // アップロード中UI制御 (二重操作・競合状態抑止)  
    if (uploadBtn) uploadBtn.disabled = true;  
    if (spinner) spinner.classList.remove('hidden');  
    relatedBtns.forEach(btn => { btn.disabled = true; });

    const albumName = albumNameEl ? albumNameEl.value.trim() : '';  

    try {  
      const res = await this.api.uploadArtwork({  
        base64Data: base64Data,  
        mimeType: uploadMimeType,  
        albumName: albumName  
      });  

      if (urlInputEl) {  
        urlInputEl.value = res.publicUrl;  
      }  
      if (previewEl) {  
        previewEl.src = res.publicUrl;  
      }  
      Utils.showToast('アルバムアートをアップロードしました', 'success');  
    } catch (uploadErr) {  
      console.error('画像アップロードエラー:', uploadErr);  
      Utils.showToast('アップロード失敗: ' + (uploadErr.message || 'エラーが発生しました'), 'error');  
    } finally {  
      if (uploadBtn) uploadBtn.disabled = false;  
      if (spinner) spinner.classList.add('hidden');  
      relatedBtns.forEach(btn => { btn.disabled = false; });
      event.target.value = '';  
    }  
  }  

  /**  
   * Google Drive画像追加モーダル表示  
   * @param {'editAlbum'|'manual'} context   
   */  
  openDriveArtworkModal(context) {  
    this.driveArtworkContext = context;  
    const modal = document.getElementById('modal-drive-artwork');  
    const input = document.getElementById('drive-artwork-url-input');  
    const errorEl = document.getElementById('drive-artwork-error');  
    if (input) input.value = '';  
    if (errorEl) {  
      errorEl.textContent = '';  
      errorEl.classList.add('hidden');  
    }  
    if (modal) modal.classList.remove('hidden');  
    if (input) input.focus();  
  }  

  /**  
   * Google Drive画像追加モーダルを閉じる  
   */  
  closeDriveArtworkModal() {  
    const modal = document.getElementById('modal-drive-artwork');  
    if (modal) modal.classList.add('hidden');  
    this.driveArtworkContext = null;  
  }  

  /**  
   * Google Drive画像追加の適用処理  
   */  
  async submitDriveArtwork() {  
    const input = document.getElementById('drive-artwork-url-input');  
    const errorEl = document.getElementById('drive-artwork-error');  
    const btnSubmit = document.getElementById('btn-submit-drive-artwork');  
    const btnCancel = document.getElementById('btn-cancel-drive-artwork');  
    const btnText = btnSubmit ? btnSubmit.querySelector('.drive-artwork-btn-text') : null;  
    const spinner = btnSubmit ? btnSubmit.querySelector('.drive-artwork-btn-spinner') : null;  

    const urlOrId = input ? input.value.trim() : '';  
    if (!urlOrId) {  
      if (errorEl) {  
        errorEl.textContent = 'Google ドライブのURLまたはファイルIDを入力してください。';  
        errorEl.classList.remove('hidden');  
      }  
      return;  
    }  

    if (errorEl) errorEl.classList.add('hidden');  
    if (btnSubmit) btnSubmit.disabled = true;  
    if (btnCancel) btnCancel.disabled = true;  
    if (btnText) btnText.classList.add('hidden');  
    if (spinner) spinner.classList.remove('hidden');  

    const context = this.driveArtworkContext || 'editAlbum';  
    const isEdit = context === 'editAlbum';  
    const albumNameEl = document.getElementById(isEdit ? 'edit-album-name' : 'manual-album-name');  
    const albumName = albumNameEl ? albumNameEl.value.trim() : '';  

    try {  
      const res = await this.api.resolveDriveArtwork({  
        driveUrlOrId: urlOrId,  
        albumName: albumName,  
        copyToAppFolder: true  
      });  

      const urlInputEl = document.getElementById(isEdit ? 'edit-album-artwork-url' : 'manual-artwork-url');  
      const previewEl = document.getElementById(isEdit ? 'edit-album-art-preview' : 'manual-art-preview');  

      if (urlInputEl) {  
        urlInputEl.value = res.publicUrl;  
      }  
      if (previewEl) {  
        previewEl.onerror = () => {  
          previewEl.src = Utils.getDefaultArtworkSvg();  
        };  
        previewEl.src = res.publicUrl;  
      }  

      this.closeDriveArtworkModal();  
      Utils.showToast('Google ドライブから画像を適用しました', 'success');  
    } catch (err) {  
      console.error('Google Drive画像解決エラー:', err);  
      if (errorEl) {  
        errorEl.textContent = err.message || 'Drive画像の取得・複製に失敗しました。';  
        errorEl.classList.remove('hidden');  
      }  
      Utils.showToast('Drive画像適用エラー: ' + (err.message || 'エラーが発生しました'), 'error');  
    } finally {  
      if (btnSubmit) btnSubmit.disabled = false;  
      if (btnCancel) btnCancel.disabled = false;  
      if (btnText) btnText.classList.remove('hidden');  
      if (spinner) spinner.classList.add('hidden');  
    }  
  }

      if (!container) return;  
      container.querySelectorAll('[data-track-index]').forEach((rowEl) => {

        const cdInput = rowEl.querySelector('.edit-track-cd');  
        const noInput = rowEl.querySelector('.edit-track-no');  
        const nameInput = rowEl.querySelector('.edit-track-name');
