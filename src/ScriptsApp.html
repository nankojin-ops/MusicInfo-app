        });  
      });  
    };  

    bindInputChange(tableBody);  
    bindInputChange(mobileContainer);  
  }  

  syncEditingTracksFromDom() {  
    const isMobile = window.innerWidth < 768;  
    const container = isMobile  
      ? document.getElementById('edit-tracks-mobile-container')  
      : document.getElementById('edit-tracks-table-body');  

    if (!container) return;  
    const rows = container.querySelectorAll('[data-track-index]');  
    rows.forEach((rowEl) => {  
      const idx = Number(rowEl.getAttribute('data-track-index'));  
      const cd = Number(rowEl.querySelector('.edit-track-cd')?.value) || 1;  
      const trackNo = Number(rowEl.querySelector('.edit-track-no')?.value) || 1;  
      const trackName = (rowEl.querySelector('.edit-track-name')?.value || '').trim();  
      const trackArtist = (rowEl.querySelector('.edit-track-artist')?.value || '').trim();  

      if (this.editingTracks[idx]) {  
        this.editingTracks[idx].cdNumber = cd;  
        this.editingTracks[idx].trackNumber = trackNo;  
        this.editingTracks[idx].trackName = trackName;  
        this.editingTracks[idx].trackArtist = trackArtist;  
      }  
    });  
  }  

  addEditTrackRow() {  
    this.syncEditingTracksFromDom();  
    const defaultArtist = (document.getElementById('edit-album-artist')?.value || '').trim();  

    let nextCd = 1;  
    let nextTrackNo = 1;  

    if (this.editingTracks.length > 0) {  
      const lastTrack = this.editingTracks[this.editingTracks.length - 1];  
      nextCd = Number(lastTrack.cdNumber) || 1;  
      nextTrackNo = (Number(lastTrack.trackNumber) || 0) + 1;  
    }  

    this.editingTracks.push({  
      cdNumber: nextCd,  
      trackNumber: nextTrackNo,  
      trackName: '',  
      trackArtist: defaultArtist  
    });  

    this.renderEditModalTracks();  

    const isMobile = window.innerWidth < 768;  
    const container = isMobile  
      ? document.getElementById('edit-tracks-mobile-container')  
      : document.getElementById('edit-tracks-table-body');  

    if (container) {  
      const lastRow = container.querySelector(`[data-track-index="${this.editingTracks.length - 1}"]`);  
      const nameInput = lastRow?.querySelector('.edit-track-name');  
      if (nameInput) {  
        nameInput.focus();  
        nameInput.scrollIntoView({ behavior: 'smooth', block: 'nearest' });  
      }  
    }  
  }  

  removeEditTrackRow(index) {  
    this.syncEditingTracksFromDom();  
    if (this.editingTracks.length <= 1) {  
      Utils.showToast('収録曲は最低1曲必要です。すべて削除することはできません。', 'warning');  
      return;  
    }  
    this.editingTracks.splice(index, 1);  
    this.renderEditModalTracks();  
  }  

  renumberEditTracks() {  
    this.syncEditingTracksFromDom();  
    if (this.editingTracks.length === 0) return;  

    const cdCounters = {};  
    this.editingTracks.forEach((t) => {  
      const cd = Number(t.cdNumber) || 1;  
      if (!cdCounters[cd]) cdCounters[cd] = 1;  
      t.trackNumber = cdCounters[cd]++;  
    });  

    this.renderEditModalTracks();  
    Utils.showToast('CD番号ごとにトラック番号を 1 から連番で再採番しました', 'info');  
  }  

  async handleSaveAlbumEdit() {  
    if (this.store.state.isSaving) return;  

    this.syncEditingTracksFromDom();  

    const albumName = (document.getElementById('edit-album-name')?.value || '').trim();  
    const albumArtist = (document.getElementById('edit-album-artist')?.value || '').trim();  
    const rawDateInputVal = (document.getElementById('edit-album-release-date')?.value || '').trim();  
    const releaseDate = (!rawDateInputVal && !this.editingReleaseDateChanged && /^\d{4}(-\d{2})?$/.test(this.editingOriginalReleaseDate || ''))  
      ? this.editingOriginalReleaseDate  
      : rawDateInputVal;  
    const artworkUrl = (document.getElementById('edit-album-artwork-url')?.value || '').trim();  

    if (!albumName) {  
      Utils.showToast('アルバム名を入力してください', 'warning');  
      document.getElementById('edit-album-name')?.focus();  
      return;  
    }  
    if (!albumArtist) {  
      Utils.showToast('アルバムアーティスト名を入力してください', 'warning');  
      document.getElementById('edit-album-artist')?.focus();  
      return;  
    }  
    if (albumName.length > 255 || albumArtist.length > 255) {  
      Utils.showToast('アルバム名およびアーティスト名は255文字以内で入力してください', 'warning');  
      return;  
    }  

    if (this.editingTracks.length === 0) {  
      Utils.showToast('収録曲は最低1曲必要です。「+ トラック追加」から追加してください', 'warning');  
      return;  
    }  

    const cdTrackSet = new Set();  
    for (let i = 0; i < this.editingTracks.length; i++) {  
      const t = this.editingTracks[i];  
      const trackName = String(t.trackName || '').trim();  
      if (!trackName) {  
        Utils.showToast(`トラック #${i + 1} の曲名が入力されていません`, 'warning');  
        return;  
      }  
      if (trackName.length > 255) {  
        Utils.showToast(`トラック #${i + 1} の曲名は255文字以内で入力してください`, 'warning');  
        return;  
      }  

      const cd = Number(t.cdNumber);  
      const trackNo = Number(t.trackNumber);  
      if (!Number.isInteger(cd) || cd < 1) {  
        Utils.showToast(`トラック #${i + 1} のCD番号は1以上の整数を指定してください`, 'warning');  
        return;  
      }  
      if (!Number.isInteger(trackNo) || trackNo < 1) {  
        Utils.showToast(`トラック #${i + 1} のトラック番号は1以上の整数を指定してください`, 'warning');  
        return;  
      }  

      const uniqueKey = `${cd}_${trackNo}`;  
      if (cdTrackSet.has(uniqueKey)) {  
        Utils.showToast(`CD番号 ${cd} の中に重複するトラック番号 #${trackNo} が存在します。「番号自動連番採番」を実行するか手動で修正してください。`, 'warning', 6000);  
        return;  
      }  
      cdTrackSet.add(uniqueKey);  
    }  

    this.store.state.isSaving = true;  

    const btnSubmit = document.getElementById('btn-submit-edit-album');  
    const btnMobileSubmit = document.getElementById('btn-mobile-submit-edit-album');  
    const spinners = document.querySelectorAll('.edit-album-submit-spinner');  
    const btnTexts = document.querySelectorAll('.edit-album-submit-btn-text');  

    if (btnSubmit) btnSubmit.disabled = true;  
    if (btnMobileSubmit) btnMobileSubmit.disabled = true;  
    spinners.forEach(s => s.classList.remove('hidden'));  
    btnTexts.forEach(t => t.textContent = '保存中...');  

    Utils.toggleGlobalLoading(true, 'スプレッドシート上のアルバムデータを一括更新中...');  

    try {  
      const payload = {  
        targetKey: this.editingTargetKey,  
        album: {  
          albumArtist,  
          albumName,  
          releaseDate,  
          artworkUrl  
        },  
        tracks: this.editingTracks.map(t => ({  
          cdNumber: Number(t.cdNumber) || 1,  
          trackNumber: Number(t.trackNumber) || 1,  
          trackName: String(t.trackName).trim(),  
          trackArtist: String(t.trackArtist || albumArtist).trim()  
        }))  
      };  

      const result = await this.api.updateAlbumBatch(payload);  

      this.store.updateAlbumInCatalog(this.editingTargetKey, payload.album, payload.tracks);  

      this.closeEditAlbumModal();  
      this.renderAll();  
      if (window.innerWidth < 768) {  
        this.setMobileStep(3);  
      }  

      Utils.showToast(`アルバム「${albumName}」(${result.updatedRowCount}曲) を更新しました！`, 'success', 4000);  

    } catch (err) {  
      console.error('アルバム編集エラー:', err);  
      Utils.showToast(`アルバム更新エラー: ${err.message}`, 'error', 7000);  
    } finally {  
      this.store.state.isSaving = false;  
      if (btnSubmit) btnSubmit.disabled = false;  
      if (btnMobileSubmit) btnMobileSubmit.disabled = false;  
      spinners.forEach(s => s.classList.add('hidden'));  
      btnTexts.forEach(t => t.textContent = '変更を保存');  
      if (btnMobileSubmit) {  
        const mobileText = btnMobileSubmit.querySelector('.edit-album-submit-btn-text');  
        if (mobileText) mobileText.textContent = '保存';  
      }  
      Utils.toggleGlobalLoading(false);  
    }  
  }  

  /**
   * アルバム複数選択モードのトグル切り替え
   * @param {boolean} [forceState]
   */
  toggleAlbumSelectMode(forceState) {
    const nextState = (typeof forceState === 'boolean') ? forceState : !this.store.state.isAlbumSelectMode;
    this.store.state.isAlbumSelectMode = nextState;

    const toolbar = document.getElementById('album-selection-toolbar');
    const btnText = document.getElementById('btn-toggle-album-select-text');
    const btnToggle = document.getElementById('btn-toggle-album-select');

    if (toolbar) {
      toolbar.classList.toggle('hidden', !nextState);
    }
    if (btnText) {
      btnText.textContent = nextState ? '完了' : '選択';
    }
    if (btnToggle) {
      if (nextState) {
        btnToggle.classList.add('bg-indigo-600', 'text-white', 'border-indigo-500');
        btnToggle.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
        btnToggle.setAttribute('aria-pressed', 'true');
        btnToggle.title = '選択モードを終了（完了）';
      } else {
        btnToggle.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500');
        btnToggle.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
        btnToggle.setAttribute('aria-pressed', 'false');
        btnToggle.title = '複数選択モードに切り替え';
      }
    }

    if (!nextState) {
      this.store.state.selectedAlbumKeysForDeletion.clear();
    }

    this.renderAlbumList();
  }

  /**
   * アルバムカード選択状態のトグル
   * @param {string} albumArtist 
   * @param {string} albumName 
   */
  toggleAlbumSelection(albumArtist, albumName) {
    const key = `${String(albumArtist || '').trim()}:::${String(albumName || '').trim()}`;
    if (this.store.state.selectedAlbumKeysForDeletion.has(key)) {
      this.store.state.selectedAlbumKeysForDeletion.delete(key);
    } else {
      this.store.state.selectedAlbumKeysForDeletion.add(key);
    }
    this.renderAlbumList();
  }

  /**
   * 表示中アーティストの全アルバムを一括選択
   */
  selectAllAlbums() {
    const albums = this.store.getAlbumsForSelectedArtist();
    const artist = this.store.state.selectedArtist || '';
    albums.forEach(album => {
      const aArtist = album.albumArtist || artist;
      const key = `${String(aArtist).trim()}:::${String(album.albumName || '').trim()}`;
      this.store.state.selectedAlbumKeysForDeletion.add(key);
    });
    this.renderAlbumList();
  }

  /**
   * 表示中アーティストの全アルバム選択を解除
   */
  deselectAllAlbums() {
    this.store.state.selectedAlbumKeysForDeletion.clear();
    this.renderAlbumList();
  }

  /**
   * 選択モード用ツールバーUI（件数バッジ・削除ボタン活性化）の同期
   */
  updateAlbumSelectionUI() {
    const countBadge = document.getElementById('selected-album-count-badge');
    const btnDelete = document.getElementById('btn-delete-selected-albums');
    const count = this.store.state.selectedAlbumKeysForDeletion ? this.store.state.selectedAlbumKeysForDeletion.size : 0;

    if (countBadge) {
      countBadge.textContent = `${count}件選択中`;
    }

    if (btnDelete) {
      if (count > 0) {
        btnDelete.disabled = false;
        btnDelete.classList.remove('cursor-not-allowed', 'opacity-50', 'bg-rose-600/50', 'text-rose-300');
        btnDelete.classList.add('bg-rose-600', 'text-white');
      } else {
        btnDelete.disabled = true;
        btnDelete.classList.add('cursor-not-allowed', 'opacity-50', 'bg-rose-600/50', 'text-rose-300');
        btnDelete.classList.remove('bg-rose-600', 'text-white');
      }
    }
  }

  /**
   * 削除対象として選択されているアルバム情報一覧を取得
   * @returns {Array<{ albumArtist: string, albumName: string, totalTracks: number }>}
   */
  getSelectedAlbumsForDeletion() {
    const albums = this.store.getAlbumsForSelectedArtist();
    const artist = this.store.state.selectedArtist || '';
    const selectedKeys = this.store.state.selectedAlbumKeysForDeletion || new Set();
    const result = [];

    albums.forEach(album => {
      const aArtist = album.albumArtist || artist;
      const key = `${String(aArtist).trim()}:::${String(album.albumName || '').trim()}`;
      if (selectedKeys.has(key)) {
        result.push({
          albumArtist: aArtist,
          albumName: album.albumName,
          totalTracks: album.totalTracks || 0
        });
      }
    });

    return result;
  }

  /**
   * アルバム削除確認モーダルを表示
   * @param {Array<{ albumArtist: string, albumName: string, totalTracks?: number }>} targetAlbums
   */
  openDeleteConfirmModal(targetAlbums) {
    if (!targetAlbums || !Array.isArray(targetAlbums) || targetAlbums.length === 0) {
      Utils.showToast('削除対象のアルバムが選択されていません', 'warning');
      return;
    }

    this.deletingAlbums = targetAlbums;

    const modal = document.getElementById('modal-delete-confirm');
    const listEl = document.getElementById('delete-confirm-album-list');
    const countEl = document.getElementById('delete-confirm-album-count');
    const warningEl = document.getElementById('delete-confirm-track-warning');
    const btnExecute = document.getElementById('btn-confirm-execute-delete');
    const btnText = document.getElementById('delete-album-btn-text');
    const spinner = document.getElementById('delete-album-spinner');

    if (countEl) countEl.textContent = String(targetAlbums.length);

    // 削除対象トラック総数を集計
    const targetKeySet = new Set(
      targetAlbums.map(a => `${String(a.albumArtist || '').trim()}:::${String(a.albumName || '').trim()}`)
    );
    const totalTracks = this.store.state.allTracks.filter(t => {
      if (!t || typeof t !== 'object') return false;
      const key = `${String(t.albumArtist || '').trim()}:::${String(t.albumName || '').trim()}`;
      return targetKeySet.has(key);
    }).length;

    if (warningEl) {
      warningEl.textContent = `合計 ${totalTracks} 曲のトラックがスプレッドシートから完全に削除されます。`;
    }

    if (listEl) {
      listEl.innerHTML = targetAlbums.map(a => `
        <div class="flex items-center justify-between p-2 rounded bg-slate-900 border border-slate-800 text-xs">
          <div class="flex flex-col min-w-0 pr-2">
            <span class="font-bold text-slate-200 truncate">${Utils.escapeHtml(a.albumName)}</span>
            <span class="text-slate-400 text-[11px] truncate">${Utils.escapeHtml(a.albumArtist)}</span>
          </div>
          <span class="text-slate-500 font-mono text-[11px] flex-shrink-0">${a.totalTracks !== undefined ? a.totalTracks + '曲' : ''}</span>
        </div>
      `).join('');
    }

    this.isDeletingAlbums = false;
    const btnCancel = document.getElementById('btn-cancel-delete-album');
    const btnClose = document.getElementById('btn-close-delete-confirm');
    if (btnExecute) btnExecute.disabled = false;
    if (btnCancel) btnCancel.disabled = false;
    if (btnClose) btnClose.disabled = false;
    if (btnText) btnText.textContent = '削除を実行する';
    if (spinner) spinner.classList.add('hidden');

    if (modal) modal.classList.remove('hidden');
  }

  /**
   * アルバム削除確認モーダルを閉じる
   */
  closeDeleteConfirmModal() {
    if (this.isDeletingAlbums) {
      // 削除API通信待機中はモーダルのクローズ（Esc/背景クリック/キャンセル操作）を抑止 (BUG-002)
      return;
    }
    const modal = document.getElementById('modal-delete-confirm');
    if (modal) modal.classList.add('hidden');
    this.deletingAlbums = null;
  }

  /**
   * アルバム削除の実行（通信・キャッシュ差分同期・画面フォールバック）
   */
  async executeDeleteAlbums() {
    if (this.isDeletingAlbums) {
      return;
    }
    if (!this.deletingAlbums || this.deletingAlbums.length === 0) {
      this.closeDeleteConfirmModal();
      return;
    }

    const btnExecute = document.getElementById('btn-confirm-execute-delete');
    const btnCancel = document.getElementById('btn-cancel-delete-album');
    const btnClose = document.getElementById('btn-close-delete-confirm');
    const btnText = document.getElementById('delete-album-btn-text');
    const spinner = document.getElementById('delete-album-spinner');

    this.isDeletingAlbums = true;
    if (btnExecute) btnExecute.disabled = true;
    if (btnCancel) btnCancel.disabled = true;
    if (btnClose) btnClose.disabled = true;
    if (btnText) btnText.textContent = '削除処理中...';
    if (spinner) spinner.classList.remove('hidden');

    const albumsToDelete = this.deletingAlbums.map(a => ({
      albumArtist: String(a.albumArtist || '').trim(),
      albumName: String(a.albumName || '').trim()
    }));

    try {
      const result = await this.api.deleteAlbumsBatch(albumsToDelete);

      // キャッシュ即時差分同期（allTracksから除外 & buildCatalog再構築）
      this.store.deleteAlbumsFromCatalog(albumsToDelete);

      this.isDeletingAlbums = false;
      this.closeDeleteConfirmModal();

      // トースト通知の作成
      const firstAlbum = albumsToDelete[0].albumName;
      const deletedCount = result && result.deletedAlbumCount !== undefined ? result.deletedAlbumCount : albumsToDelete.length;
      const trackCount = result && result.deletedTrackCount !== undefined ? result.deletedTrackCount : 0;
      const toastMsg = deletedCount > 1
        ? `「${firstAlbum}」など ${deletedCount} 件のアルバム（計 ${trackCount} 曲）を削除しました`
        : `アルバム「${firstAlbum}」（計 ${trackCount} 曲）を削除しました`;
      Utils.showToast(toastMsg, 'success');

      // 画面フォールバック制御 (ADR-DEL-005)
      this.toggleAlbumSelectMode(false);

      // 1. STEP 3 で表示中のアルバムが削除対象に含まれていた場合
      const deletedKeySet = new Set(albumsToDelete.map(a => `${a.albumArtist}:::${a.albumName}`));
      const currentSelectedAlbum = this.store.state.selectedAlbum;
      const currentSelectedArtist = this.store.state.selectedArtist;
      const currentKey = `${String(currentSelectedArtist || '').trim()}:::${String(currentSelectedAlbum || '').trim()}`;

      let currentAlbumWasDeleted = false;
      if (currentSelectedAlbum && deletedKeySet.has(currentKey)) {
        this.store.state.selectedAlbum = null;
        this.renderTrackDetail();
        currentAlbumWasDeleted = true;
      }

      // 2. 選択中アーティストにアルバムが残っているか判定
      const remainingAlbums = this.store.getAlbumsForSelectedArtist();

      if (remainingAlbums.length > 0) {
        // アルバムが1件以上残っている場合: アルバム一覧を再描画
        if (!this.store.state.selectedAlbum) {
          this.store.state.selectedAlbum = remainingAlbums[0].albumName;
          this.renderTrackDetail();
        }
        this.renderArtistList();
        this.renderAlbumList();

        if (currentAlbumWasDeleted && window.innerWidth < 768) {
          this.setMobileStep(2);
        }
      } else {
        // 選択中アーティストの全アルバムが削除された場合: アーティストはカタログから消滅
        this.store.state.selectedArtist = null;
        this.store.state.selectedAlbum = null;
        this.renderArtistList();
        this.renderAlbumList();
        this.renderTrackDetail();

        if (window.innerWidth < 768) {
          this.setMobileStep(1);
        } else if (this.store.state.artistList.length > 0) {
          // PCでは先頭アーティストを選択
          this.selectArtist(this.store.state.artistList[0]);
        }
      }
    } catch (err) {
      console.error('アルバム一括削除エラー:', err);
      Utils.showToast(err.message || 'アルバムの削除に失敗しました', 'error');
    } finally {
      this.isDeletingAlbums = false;
      if (btnExecute) btnExecute.disabled = false;
      if (btnCancel) btnCancel.disabled = false;
      if (btnClose) btnClose.disabled = false;
      if (btnText) btnText.textContent = '削除を実行する';
      if (spinner) spinner.classList.add('hidden');
    }
  }
}  

if (typeof window !== 'undefined') {  
  window.App = App;  
}  

if (typeof module !== 'undefined' && module.exports) {  
  module.exports = App;  
}  
</script>
