<header id="app-header" class="min-h-[3.5rem] md:h-14 border-b border-slate-800 bg-slate-950 flex flex-wrap md:flex-nowrap items-center justify-between px-2.5 md:px-4 py-1.5 md:py-0 z-20 flex-shrink-0 gap-x-1.5 gap-y-1.5">
  <!-- ロゴ & タイトル -->
  <div class="flex items-center gap-2 min-w-0">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md flex-shrink-0">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
      </svg>
    </div>
    <span class="font-bold text-sm sm:text-base md:text-lg tracking-tight bg-gradient-to-r from-slate-100 to-slate-400 bg-clip-text text-transparent truncate">
      MusicInfo
    </span>
  </div>

  <!-- PC用 全体クイック横断検索バー -->
  <div class="hidden md:flex flex-1 max-w-lg mx-4 relative" id="header-search-container">
    <div class="relative w-full">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input type="text" id="header-search-input" placeholder="曲名、アルバム、アーティスト、CD番号で横断検索... (↑↓で選択, Escで閉じる)"
        autocomplete="off" spellcheck="false"
        class="w-full pl-9 pr-8 py-1.5 bg-slate-900 border border-slate-700/80 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      <button id="header-search-clear" type="button" class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-200 transition" title="検索ワードを消去">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- PC検索 ドロップダウン結果コンテナ -->
    <div id="pc-search-dropdown" class="hidden absolute top-full left-0 w-full mt-1.5 bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-xl shadow-2xl overflow-hidden z-50 flex flex-col max-h-[75vh]">
      <div id="pc-search-results" class="overflow-y-auto p-1 divide-y divide-slate-800/60" role="listbox"></div>
    </div>
  </div>

  <!-- 右側ボタングループ -->
  <div class="flex items-center flex-wrap justify-end gap-1 sm:gap-1.5 md:gap-2 min-w-0 max-w-full md:flex-shrink-0">
    <!-- 動作モードバッジ兼 接続設定ボタン -->
    <button id="btn-open-connection-modal" type="button" title="接続設定（デモ/ローカル ⇄ GAS API 連携）"
      class="min-h-[44px] min-w-[44px] inline-flex items-center gap-1.5 px-2 md:px-2.5 py-1.5 text-[11px] md:text-xs font-medium bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700/90 rounded-lg transition active:scale-95">
      <span id="connection-mode-dot" class="w-2 h-2 rounded-full bg-amber-400 flex-shrink-0"></span>
      <span id="connection-mode-badge" class="max-w-[72px] sm:max-w-none truncate">デモ/ローカル</span>
      <svg class="w-3.5 h-3.5 text-slate-400 hidden sm:inline flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
    </button>

    <!-- 手動登録ボタン -->
    <button id="btn-open-manual-modal" type="button" class="min-h-[44px] min-w-[44px] inline-flex items-center gap-1.5 px-2 md:px-3 py-1.5 text-xs md:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition active:scale-95">
      <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
      <span class="hidden sm:inline">手動登録</span>
      <span class="sm:hidden">手動</span>
    </button>

    <!-- アルバム検索・一括登録ボタン -->
    <button id="btn-open-itunes-modal" type="button" class="min-h-[44px] min-w-[44px] inline-flex items-center gap-1.5 px-2 md:px-3 py-1.5 text-xs md:text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow-sm transition active:scale-95">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <span class="hidden sm:inline">アルバム検索・一括登録</span>
      <span class="sm:hidden">一括登録</span>
    </button>

    <!-- 再読み込みボタン -->
    <button id="btn-reload-data" type="button" title="データを再読み込み" class="min-h-[44px] min-w-[44px] flex items-center justify-center p-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
      </svg>
    </button>
  </div>
</header>
