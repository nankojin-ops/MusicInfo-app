<!-- アルバム削除確認モーダル -->
<div id="modal-delete-confirm" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 md:p-4 bg-slate-950/85 backdrop-blur-sm">
  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-modalScale">

    <!-- モーダルヘッダー -->
    <div class="px-4 py-3 border-b border-slate-800 bg-slate-950 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2">
        <button id="btn-close-delete-confirm" type="button" class="min-h-[44px] min-w-[44px] text-slate-400 hover:text-slate-200 p-2 -ml-2 rounded-lg hover:bg-slate-800 transition flex items-center justify-center" title="閉じる">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded bg-rose-600 flex items-center justify-center text-white">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </div>
          <h3 class="text-sm md:text-base font-bold text-slate-100">アルバムの削除確認</h3>
        </div>
      </div>
    </div>

    <!-- モーダル本文 (Enter誤送信抑止) -->
    <form id="form-delete-confirm" onsubmit="event.preventDefault();" class="p-4 md:p-5 space-y-4">
      
      <!-- 警告メッセージボックス -->
      <div class="bg-rose-950/40 border border-rose-900/60 rounded-xl p-3.5 text-xs text-rose-200 space-y-1.5">
        <div class="font-bold text-rose-300 flex items-center gap-1.5 text-xs">
          <svg class="w-4 h-4 text-rose-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <span>警告: この操作は取り消せません</span>
        </div>
        <p class="text-slate-300 leading-relaxed">
          選択したアルバムに属するすべての収録曲データがスプレッドシートから完全に削除されます。
        </p>
        <p id="delete-confirm-track-warning" class="font-semibold text-rose-300 pt-1 border-t border-rose-900/40">
          合計 0 曲のトラックが完全に削除されます。
        </p>
      </div>

      <!-- 削除対象アルバムリスト表示領域 -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300">
          削除対象アルバム (<span id="delete-confirm-album-count">0</span>件)
        </label>
        <div id="delete-confirm-album-list" class="max-h-48 overflow-y-auto space-y-1.5 p-2 bg-slate-950/80 border border-slate-800 rounded-lg text-xs">
          <!-- 動的レンダリング: 対象アルバム項目 -->
        </div>
        <p class="text-[11px] text-slate-500 pt-1">
          ※Google ドライブ内のアートワーク画像ファイルは削除されず保持されます。
        </p>
      </div>

      <!-- アクションボタン群 (WCAG 44pxタップ領域確保) -->
      <div class="pt-3 border-t border-slate-800 flex items-center justify-end gap-2.5">
        <button id="btn-cancel-delete-album" type="button"
          class="min-h-[44px] min-w-[80px] px-4 py-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition flex items-center justify-center">
          キャンセル
        </button>
        <button id="btn-confirm-execute-delete" type="button"
          class="min-h-[44px] min-w-[120px] px-5 py-2 text-xs font-semibold text-white bg-rose-600 hover:bg-rose-500 disabled:bg-slate-800 disabled:text-slate-600 rounded-lg shadow transition flex items-center justify-center gap-2">
          <span id="delete-album-btn-text">削除を実行する</span>
          <div id="delete-album-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </div>
    </form>

  </div>
</div>
