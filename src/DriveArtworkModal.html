<!-- Google Drive画像追加モーダル -->
<div id="modal-drive-artwork" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 md:p-4 bg-slate-950/85 backdrop-blur-sm">
  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-modalScale">

    <!-- モーダルヘッダー -->
    <div class="px-4 py-3 border-b border-slate-800 bg-slate-950 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2">
        <button id="btn-close-drive-artwork" type="button" class="min-h-[44px] min-w-[44px] text-slate-400 hover:text-slate-200 p-2 -ml-2 rounded-lg hover:bg-slate-800 transition flex items-center justify-center" title="閉じる">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded bg-emerald-600 flex items-center justify-center text-white">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"></path>
            </svg>
          </div>
          <h3 class="text-sm md:text-base font-bold text-slate-100">Google ドライブから画像を追加</h3>
        </div>
      </div>
    </div>

    <!-- モーダル本文 (Enter誤送信抑止) -->
    <form id="form-drive-artwork" onsubmit="event.preventDefault();" class="p-4 md:p-5 space-y-4">
      
      <!-- 取得手順ガイド (3ステップ) -->
      <div class="bg-slate-950/70 border border-slate-800/90 rounded-xl p-3.5 text-xs text-slate-300 space-y-2">
        <div class="font-bold text-slate-200 flex items-center gap-1.5 text-xs">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Google ドライブ リンク取得手順
        </div>
        <ol class="list-decimal list-inside space-y-1 text-slate-400 pl-1 leading-relaxed">
          <li>Google ドライブで画像ファイルを右クリック（スマホは「︙」メニュー）</li>
          <li><span class="text-slate-200 font-medium">「共有」</span> または <span class="text-slate-200 font-medium">「リンクをコピー」</span> を選択</li>
          <li>コピーしたURL（またはファイルID）を下の入力欄に貼り付けます</li>
        </ol>
        <p class="text-[11px] text-slate-500 pt-1 border-t border-slate-800/80">
          ※画像はアプリ専用管理フォルダへ自動複製され、スマートフォン未認証環境でも閲覧可能な公開設定が付与されます。
        </p>
      </div>

      <!-- Drive URL / ID 入力欄 -->
      <div class="space-y-1.5">
        <label for="drive-artwork-url-input" class="block text-xs font-semibold text-slate-300">
          Google ドライブ 共有URL または ファイルID <span class="text-rose-500">*</span>
        </label>
        <div class="relative">
          <input type="text" id="drive-artwork-url-input" placeholder="https://drive.google.com/file/d/... または ファイルID" required
            class="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs md:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
        </div>
        <div id="drive-artwork-error" class="hidden text-xs text-rose-400 font-medium pt-1"></div>
      </div>

      <!-- アクションボタン群 (WCAG 44pxタップ領域確保) -->
      <div class="pt-3 border-t border-slate-800 flex items-center justify-end gap-2.5">
        <button id="btn-cancel-drive-artwork" type="button"
          class="min-h-[44px] min-w-[80px] px-4 py-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition flex items-center justify-center">
          キャンセル
        </button>
        <button id="btn-submit-drive-artwork" type="submit"
          class="min-h-[44px] min-w-[100px] px-5 py-2 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 rounded-lg shadow transition flex items-center justify-center gap-2">
          <span class="drive-artwork-btn-text">適用する</span>
          <div class="drive-artwork-btn-spinner hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </div>
    </form>

  </div>
</div>
