  <script>
    // アプリケーション起動
    function startApp() {
      const AppClass = window.App || (typeof App !== 'undefined' ? App : null);
      if (!AppClass) {
        console.error('App クラスがロードされていません');
        return;
      }
      if (!window.app) {
        window.app = new AppClass();
        window.app.init();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
