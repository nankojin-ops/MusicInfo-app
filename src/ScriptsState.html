<script>
/**
 * フロントエンド状態管理クラス
 */
class Store {
  constructor() {
    this.state = {
      allTracks: [],
      musicCatalog: {},
      artistList: [],
      selectedArtist: null,
      selectedAlbum: null,
      mobileStep: 1, // 1: アーティスト, 2: アルバム, 3: トラック
      searchQuery: '',
      artistFilter: '',
      isLoading: false,
      isSaving: false,

      // iTunesモーダル
      itunesSearchResults: [],
      selectedItunesAlbum: null,

      // 手動登録フォーム状態
      manualForm: {
        cdNumber: 1,
        albumArtist: '',
        albumName: '',
        trackArtist: '',
        trackNumber: 1,
        trackName: '',
        releaseDate: '',
        artworkUrl: ''
      },

      // 画像拡大
      zoomImageUrl: null,
      zoomImageTitle: ''
    };
  }

  /**
   * 全トラック配列をセットしカタログツリーを構築
   * @param {Array<RawTrackRow>} tracks 
   */
  setTracks(tracks) {
    this.state.allTracks = Array.isArray(tracks) ? tracks : [];
    this.buildCatalog();
  }

  /**
   * フラット配列から MusicCatalog ツリーを構築
   */
  buildCatalog() {
    const catalog = {};

    this.state.allTracks.forEach((t) => {
      if (!t || typeof t !== 'object') return;

      const artist = String(t.albumArtist || '').trim() || '不明なアーティスト';
      const album = String(t.albumName || '').trim() || '不明なアルバム';
      const cdNo = (t.cdNumber !== undefined && t.cdNumber !== null && t.cdNumber !== '') ? (Number(t.cdNumber) || 1) : 1;

      if (!catalog[artist]) {
        catalog[artist] = {
          artistName: artist,
          albumCount: 0,
          albums: {}
        };
      }

      if (!catalog[artist].albums[album]) {
        catalog[artist].albums[album] = {
          albumName: album,
          albumArtist: artist,
          releaseDate: t.releaseDate ? String(t.releaseDate) : '',
          artworkUrl: t.artworkUrl ? String(t.artworkUrl) : '',
          totalTracks: 0,
          discs: {}
        };
        catalog[artist].albumCount++;
      }

      const albumObj = catalog[artist].albums[album];
      if (t.releaseDate && !albumObj.releaseDate) albumObj.releaseDate = String(t.releaseDate);
      if (t.artworkUrl && !albumObj.artworkUrl) albumObj.artworkUrl = String(t.artworkUrl);

      if (!albumObj.discs[cdNo]) {
        albumObj.discs[cdNo] = {
          cdNumber: cdNo,
          tracks: []
        };
      }

      albumObj.discs[cdNo].tracks.push({
        cdNumber: cdNo,
        trackNumber: (t.trackNumber !== undefined && t.trackNumber !== null && t.trackNumber !== '') ? (Number(t.trackNumber) || 1) : 1,
        trackName: (t.trackName !== undefined && t.trackName !== null) ? String(t.trackName) : '無題',
        trackArtist: (t.trackArtist !== undefined && t.trackArtist !== null) ? String(t.trackArtist) : artist
      });

      albumObj.totalTracks++;
    });

    // 各ディスク内のトラックをトラック番号順にソート
    Object.values(catalog).forEach((artistData) => {
      Object.values(artistData.albums).forEach((albumData) => {
        Object.values(albumData.discs).forEach((discGroup) => {
          discGroup.tracks.sort((a, b) => a.trackNumber - b.trackNumber);
        });
      });
    });

    this.state.musicCatalog = catalog;
    this.state.artistList = Object.keys(catalog).sort((a, b) => a.localeCompare(b, 'ja'));
  }

  /**
   * フィルターされたアーティスト名一覧を取得
   * @returns {Array<string>}
   */
  getFilteredArtists() {
    const filter = this.state.artistFilter.trim().toLowerCase();
    if (!filter) return this.state.artistList;
    return this.state.artistList.filter((artist) => artist.toLowerCase().includes(filter));
  }

  /**
   * 現在選択中アーティストのアルバム配列を取得
   * @returns {Array<AlbumData>}
   */
  getAlbumsForSelectedArtist() {
    if (!this.state.selectedArtist || !this.state.musicCatalog[this.state.selectedArtist]) {
      return [];
    }
    const albumsObj = this.state.musicCatalog[this.state.selectedArtist].albums;
    return Object.values(albumsObj).sort((a, b) => {
      // リリース日降順、無ければアルバム名昇順
      if (a.releaseDate && b.releaseDate) return b.releaseDate.localeCompare(a.releaseDate);
      return a.albumName.localeCompare(b.albumName, 'ja');
    });
  }

  /**
   * 現在選択中のアルバムデータを取得
   * @returns {AlbumData|null}
   */
  getSelectedAlbumData() {
    if (!this.state.selectedArtist || !this.state.selectedAlbum) return null;
    const artist = this.state.musicCatalog[this.state.selectedArtist];
    if (!artist) return null;
    return artist.albums[this.state.selectedAlbum] || null;
  }

  /**
   * 全体クイック横断検索
   * @param {string} query 
   * @returns {Array<RawTrackRow>}
   */
  searchAcrossAllTracks(query) {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return [];
    return this.state.allTracks.filter((t) => {
      if (!t || typeof t !== 'object') return false;
      const tName = String(t.trackName !== undefined && t.trackName !== null ? t.trackName : '').toLowerCase();
      const aName = String(t.albumName !== undefined && t.albumName !== null ? t.albumName : '').toLowerCase();
      const aArtist = String(t.albumArtist !== undefined && t.albumArtist !== null ? t.albumArtist : '').toLowerCase();
      const tArtist = String(t.trackArtist !== undefined && t.trackArtist !== null ? t.trackArtist : '').toLowerCase();
      const cdNoStr = String(t.cdNumber !== undefined && t.cdNumber !== null ? t.cdNumber : '');

      return (
        tName.includes(q) ||
        aName.includes(q) ||
        aArtist.includes(q) ||
        tArtist.includes(q) ||
        cdNoStr === q
      );
    });
  }
}

if (typeof window !== 'undefined') {
  window.Store = Store;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = Store;
}
</script>
